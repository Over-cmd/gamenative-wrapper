name: PanVK kbase wrapper release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile Mesa with Docker
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest build

      - name: Stage runtime files for Bannerlator
        run: |
          echo "-> Inicializando empaquetado estructural solicitado (usr/lib y usr/share)..."
          rm -rf pkg
          mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d

          echo "-> Moviendo binario compilado por Docker..."
          if [ -f "build/libvulkan_wrapper.so" ]; then
            cp -v "build/libvulkan_wrapper.so" pkg/usr/lib/libvulkan_panfrost_kbase.so
          else
            echo "ERROR: ¡No se encontró el binario compilado por Docker!" && exit 1
          fi

          echo "-> Escribiendo manifiesto libvulkan_panfrost_kbase.aarch64.json..."
          echo '{' > pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json
          echo '    "file_format_version": "1.0.0",' >> pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json
          echo '    "ICD": {' >> pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json
          echo '        "library_path": "usr/lib/libvulkan_panfrost_kbase.so",' >> pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json
          echo '        "api_version": "1.1.0"' >> pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json
          echo '    }' >> pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json
          echo '}' >> pkg/usr/share/vulkan/icd.d/libvulkan_panfrost_kbase.aarch64.json

          echo "-> Creando archivo meta.json para Bannerlator..."
          echo '{"name": "PanVK Panfrost Kbase Mod", "description": "Controlador Vulkan personalizado para GPUs Mali con soporte Kbase Kernel Driver", "type": "graphics_driver", "version": "1.0.0", "author": "Mesa Community / Mod", "compatibility": {"min_bannerlator_version": "3.0"}}' > pkg/meta.json

          echo "-> Asignando permisos POSIX..."
          chmod -R 755 pkg/
          echo "=== Árbol Estructural Preparado ==="
          ls -R pkg
          echo "===================================="

      - name: Compress and Structure Package
        run: |
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../PanVK_kbase_wrapper.tzst *
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-kbase-wrapper
          path: PanVK_kbase_wrapper.tzst
