      # INYECCIÓN DE CONTROL DE FLUJO HÍBRIDO OPTIMIZADO (Anti-Congelamiento Unisoc T618)
      - name: Surgical Silicon Modification (Anti-Overflow MALI Hybrid 32/64 Injection)
        run: |
          echo "-> Rastreando el corazon del Wrapper para soldar compatibilidad hibrida Vulkan..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Aplicando parches de alineacion de memoria y sincronizacion en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            sed -i '1i#include <stdint.h>' "$WRAPPER_DEVICE"
            sed -i '1iextern int mallopt(int param, int value);' "$WRAPPER_DEVICE"
            sed -i '1iextern int setenv(const char *name, const char *value, int overwrite);' "$WRAPPER_DEVICE"
            
            # CAMBIOS CLAVE PARA REPARAR CAÍDAS A 0%:
            # 1. Cambiamos "mailbox" por "immediate" para liberar los frames de la GPU inmediatamente.
            # 2. Subimos MESA_VK_WSI_QUEUE_SIZE a "2" o "3" para evitar que el renderizador se quede sin buffer en 32 bits.
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;i\\ extern int mallopt(int p, int v);\\n extern int setenv(const char *n, const char *v, int o);\\n mallopt(-1002, 0);\\n setenv("MESA_VK_WSI_PRESENT_MODE", "immediate", 1);\\n setenv("vblank_mode", "0", 1);\\n if (sizeof(void*) == 4) {\\n   setenv("MESA_VK_WSI_QUEUE_SIZE", "2", 1);\\n }' "$WRAPPER_DEVICE"
            echo "-> Envoltura hibrida optimizada inyectada con exito."
          else
            echo "-> Archivo wrapper_device.c no encontrado, aplicando fallback optimizado global..."
            find src/ -name "*.c" -exec sed -i 's/vk_icdGetInstanceProcAddr/extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv("MESA_VK_WSI_PRESENT_MODE", "immediate", 1); setenv("vblank_mode", "0", 1); if (sizeof(void*) == 4) { setenv("MESA_VK_WSI_QUEUE_SIZE", "2", 1); } vk_icdGetInstanceProcAddr/g' {} + || true
          fi
