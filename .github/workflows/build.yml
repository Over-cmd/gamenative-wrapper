name: GameNative Vulkan Wrapper Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gamenative-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type:
          - release

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          echo "-> Aplicando parches de compatibilidad de API 30 en anon_file.c..."
          TARGET_FILE="src/util/anon_file.c"
          if [ -f "$TARGET_FILE" ]; then
            sed -i 's/fd = syscall(SYS_memfd_create, debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING);/fd = memfd_create(debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING);/g' "$TARGET_FILE"
            echo "-> Parche aplicado con exito en $TARGET_FILE."
          else
            echo "ADVERTENCIA: No se encontro src/util/anon_file.c"
          fi

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Base Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libelf-dev \
            bison \
            flex \
            pkg-config \
            gettext \
            patchelf \
            unzip \
            llvm \
            clang
          python -m pip install --upgrade pip
          pip install mako PyYAML 'meson>=1.4.0' ninja packaging

      - name: Unzip Local Android Environment Shims
        run: |
          echo "-> Descomprimiendo shims.zip en el area de trabajo..."
          if [ -f "shims.zip" ]; then
            unzip -o shims.zip -d ./
            mkdir -p "$GITHUB_WORKSPACE/shims_target"
            cp -rf ./shims/* "$GITHUB_WORKSPACE/shims_target/"
            echo "=== Estructura verificada de los archivos .pc de X11 ==="
            ls -la "$GITHUB_WORKSPACE/shims_target"
          else
            echo "🚨 ERROR: Falta shims.zip en la raiz de tu repositorio!" && exit 1
          fi

      - name: Auto-Detect True Android NDK Path
        id: ndk-detector
        run: |
          echo "-> Escaneando el sistema en busca de carpetas NDK validas..."
          TRUE_NDK=""
          for path in /usr/local/lib/android/sdk/ndk/* /home/runner/Android/Sdk/ndk/*; do
            if [ -d "$path/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
              TRUE_NDK="$path"
              break
            fi
          done
          if [ -z "$TRUE_NDK" ]; then
            echo "🚨 ERROR CRITICO: No se encontro ningun NDK real con binarios de 64 bits!" && exit 1
          fi
          echo "-> NDK Real Detectado y validado en: $TRUE_NDK"
          echo "REAL_NDK_HOME=$TRUE_NDK" >> $GITHUB_ENV

      - name: Configure GameNative Cross-Compilation (Meson)
        run: |
          export ANDROID_NDK_HOME="${{ env.REAL_NDK_HOME }}"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/shims_target"
          export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/shims_target"
          export PKG_CONFIG_SYSROOT_DIR=""
          
          echo "-> Traduciendo variables de entorno en android-64.toml..."
          if [ -f "android-64.toml" ]; then
            envsubst < android-64.toml > android-cross-compiled.txt
          else
            envsubst < android.toml > android-cross-compiled.txt
          fi
          
          echo "-> Inicializando Setup de Meson con -Dvulkan-drivers=wrapper..."
          meson setup build --reconfigure \
            --cross-file android-cross-compiled.txt \
            -Dbuildtype=${{ matrix.build-type }} \
            -Dplatforms= \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dvalgrind=disabled \
            -Dzstd=disabled \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers=[]

      - name: Compile GameNative Engine
        run: |
          echo "-> Ejecutando compilación cruzada hacia ARM64 a través de Ninja..."
          meson compile -C build

      # 🟢 EMPAQUETADO ULTRA-LIMPIO: Única y estrictamente libvulkan_wrapper.so en usr/lib
      - name: Structure and Pack wrapper.tzst for Bannerlator
        run: |
          echo "-> Creando arbol de carpetas estricto para el emulador..."
          rm -rf pkg
          mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          
          echo "-> Buscando el binario real del wrapper generado por el compilador..."
          TARGET_SO=$(find build/ -not -path "build/subprojects/*" -not -path "build/meson-private/*" -type f -name "*.so" | grep -E "libvulkan|wrapper|gamenative" | head -n 1)
          
          if [ -z "$TARGET_SO" ] || [ ! -f "$TARGET_SO" ]; then
            TARGET_SO=$(find build/src/ -not -path "build/subprojects/*" -type f -name "*.so" | head -n 1)
          fi
          
          if [ -n "$TARGET_SO" ] && [ -f "$TARGET_SO" ]; then
            echo "-> 🎯 ¡Binario legítimo de Vulkan Wrapper localizado en: $TARGET_SO!"
            echo "-> Copiando y renombrando a libvulkan_wrapper.so..."
            cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_wrapper.so
            patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
            llvm-strip --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so
          else
            echo "🚨 ERROR CRITICO SEVERO: El compilador terminó pero no se encontró la librería .so esperada."
            exit 1
          fi

          # 🔴 ELIMINADA LA INYECCIÓN DE LOS 13 ARCHIVOS EXTRAS PARA EVITAR CONFLICTOS

          echo "-> Creando manifiestos ICD JSON oficiales con formato compatible 1.0.0..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json

          echo "msf:315508" > pkg/version.txt
          
          echo "-> Ajustando permisos y empaquetando..."
          chmod -R 755 pkg/
          chmod 644 pkg/usr/lib/*.so* 2>/dev/null || true
          chmod 644 pkg/usr/share/vulkan/icd.d/*.json 
          chmod 644 pkg/usr/share/vulkan/settings.d/*.json 
          chmod 644 pkg/version.txt

          echo "=== Arbol de Estructura Purificada Final ==="
          ls -R pkg
          echo "=========================================="
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ version.txt
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-Mali-G52-Wrapper
          path: wrapper.tzst
