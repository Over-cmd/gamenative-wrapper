# COMPILACIÓN INDESTRUCTIBLE GAME NATIVE WRAPPER - MALI-G52 VULKAN
name: GameNative Vulkan Wrapper Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gamenative-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      # Parches de fuerza bruta indispensables para liberar la Mali-G52 (Unisoc T618)
      - name: Inject Hardware Patches for Mali-G52 (Bifrost v3)
        run: |
          sed -i 's/fd = syscall(SYS_memfd_create, debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING);/fd = memfd_create(debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING);/g' src/util/anon_file.c 2>/dev/null || true
          find . -name "pan_device.c" -exec sed -i 's/pan_query_core_count(&dev->kmod.dev->props, &dev->core_id_range);/dev->core_id_range = pan_query_core_count(\&dev->kmod.dev->props);/g' {} + 2>/dev/null || true
          find . -name "pan_device.c" -exec sed -i 's/\\&/\&/g' {} + 2>/dev/null || true
          sed -i "s/cc.find_library('rt'/dependency('', required : false) #/g" meson.build 2>/dev/null || true

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Base Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libelf-dev bison flex pkg-config gettext patchelf unzip llvm clang curl
          python -m pip install --upgrade pip
          pip install mako PyYAML 'meson>=1.4.0' ninja packaging

      - name: Unzip Local Android Environment Shims
        run: |
          echo "-> Descomprimiendo shims.zip en el area de trabajo..."
          if [ -f "shims.zip" ]; then
            unzip -o shims.zip -d ./
            mkdir -p "$GITHUB_WORKSPACE/shims_target"
            cp -rf ./shims/* "$GITHUB_WORKSPACE/shims_target/"
          else
            echo "🚨 ERROR: Falta shims.zip en la raiz de tu repositorio!" && exit 1
          fi

      - name: Auto-Detect True Android NDK Path
        id: ndk-detector
        run: |
          TRUE_NDK=""
          for path in /usr/local/lib/android/sdk/ndk/* /home/runner/Android/Sdk/ndk/*; do
            if [ -d "$path/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then TRUE_NDK="$path"; break; fi
          done
          echo "REAL_NDK_HOME=$TRUE_NDK" >> $GITHUB_ENV

      # 🟢 INYECCIÓN MAESTRA DE LIBADRENOTOOLS VIA CDN: Satisface la línea 69 del subproyecto de forma local
      - name: Pre-Download and Inject Physical libadrenotools Source
        run: |
          mkdir -p subprojects
          echo "-> Descargando tarball plano de libadrenotools desde el CDN prioritario de GitHub..."
          curl -fSL "https://github.com" -o adrenotools.zip
          
          echo "-> Descomprimiendo en el arbol local de subproyectos..."
          unzip -q adrenotools.zip -d subprojects/
          
          EXTRACTED_DIR=$(find subprojects/ -maxdepth 1 -type d -name "*libadrenotools*" | head -n 1)
          mv "$EXTRACTED_DIR" subprojects/libadrenotools
          echo "-> ¡Codigo fuente inyectado con exito de forma fisica local!"
          
          echo "-> Removiendo archivos wrap residuales para obligar a Meson a trabajar 100% offline..."
          rm -rf subprojects/*.wrap 2>/dev/null || true
          rm -rf *.wrap 2>/dev/null || true

      # Configuración limpia offline del Wrapper
      - name: Configure GameNative Cross-Compilation (Meson)
        run: |
          export ANDROID_NDK_HOME="${{ env.REAL_NDK_HOME }}"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/shims_target"
          export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/shims_target"
          export PKG_CONFIG_SYSROOT_DIR=""
          
          echo "-> Traduciendo variables de entorno en la plantilla de configuracion cruzada..."
          if [ -f "android-64.toml" ]; then envsubst < android-64.toml > android-cross-compiled.txt
          else envsubst < android.toml > android-cross-compiled.txt; fi
          
          sed -i "s|pkg_config_libdir = .*|pkg_config_libdir = '$GITHUB_WORKSPACE/shims_target'|g" android-cross-compiled.txt 2>/dev/null || true
          sed -i "s|pkg_config_path = .*|pkg_config_path = '$GITHUB_WORKSPACE/shims_target'|g" android-cross-compiled.txt 2>/dev/null || true
          
          echo "-> Inicializando Setup de Meson para GameNative con -Dvulkan-drivers=wrapper..."
          meson setup build --reconfigure \
            --cross-file android-cross-compiled.txt \
            --wrap-mode=nodownload \
            -Dbuildtype=${{ matrix.build-type }} \
            -Dplatforms= \
            -Dglx=disabled -Dgbm=disabled -Degl=disabled -Dopengl=false -Dgles1=disabled -Dgles2=disabled -Dllvm=disabled -Dvalgrind=disabled -Dzstd=disabled \
            -Dvulkan-drivers=wrapper -Dgallium-drivers=[]

      - name: Compile GameNative Engine
        run: meson compile -C build

      # EMPAQUETADO OFICIAL Y DIRECTO EN EL CONTENEDOR (ICD 1.0.0 COMPATIBLE)
      - name: Structure and Pack wrapper.tzst for Bannerlator
        run: |
          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          
          echo "-> Localizando el binario principal generado..."
          TARGET_SO=$(find build/ -not -path "build/subprojects/*" -not -path "build/meson-private/*" -type f -name "*.so" | grep -E "libvulkan|wrapper|gamenative" | head -n 1)
          if [ -z "$TARGET_SO" ] || [ ! -f "$TARGET_SO" ]; then TARGET_SO=$(find build/src/ -not -path "build/subprojects/*" -type f -name "*.so" | head -n 1); fi
          
          cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_wrapper.so
          patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so 2>/dev/null || true
          llvm-strip --strip-unneeded pkg/usr/lib/libvulkan_wrapper.so
          
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {"ICD": {"api_version": "1.4.352", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}
          EOF
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {"ICD": {"api_version": "1.4.352", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}
          EOF
          
          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync,nir","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost","vblank_mode":"0","MESA_GLSL_CACHE_DISABLE":"1","MESA_SHADER_CACHE_DISABLE":"true","NIR_DEBUG":"tgsi","MESA_VK_WSI_PRESENT_MODE":"immediate","MESA_VK_WSI_DEBUG":"always_async"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json
          echo "msf:315508" > pkg/version.txt
          
          chmod -R 755 pkg/ && chmod 755 pkg/usr/lib/libvulkan_wrapper.so
          cd pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ version.txt
          
      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-Mali-G52-Wrapper
          path: wrapper.tzst
