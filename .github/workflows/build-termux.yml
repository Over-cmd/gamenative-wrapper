name: Compilación Local con nuestro propio Docker Wrapper Unisoc

on:
  push:
    branches: [ "main", "master", "wrapper-25" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilación
  CUSTOM_TAG: gamenative-unisoc-builder:latest

jobs:
  build-driver:
    runs-on: ubuntu-latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Trae libadrenotools desde fuera de forma limpia nativa de Git

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Instalar herramientas de compresión
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # ¡INYECTOR HÍBRIDO ULTRA-COMPRIMIDO QUE EVITA LOS APAGONES Y CONGELAMIENTOS EN 32 BITS!
      - name: Inyección Quirúrgica Silicio (Modo Fluido y Anti-Pagones)
        run: |
          python3 -c "import os; t='src/vulkan/runtime/vk_instance.c'; f=open(t,'r') if os.path.exists(t) else None; c='\n#include <stdint.h>\nextern int mallopt(int p, int v);\nextern int setenv(const char* n, const char* v, int o);\n'+f.read().replace('vk_icdGetInstanceProcAddr','mallopt(-1002,0);setenv(\"MESA_VK_WSI_PRESENT_MODE\",\"mailbox\",1);setenv(\"vblank_mode\",\"0\",1);if(sizeof(void*)==4){setenv(\"MESA_VK_WSI_QUEUE_SIZE\",\"1\",\"1\");}vk_icdGetInstanceProcAddr',1) if f else ''; f.close() if f else None; f=open(t,'w') if f else None; f.write(c) if f else None; f.close() if f else None"

      # ¡PASO CORREGIDO: URL estática blindada de Google para descargar el NDK original!
      - name: Generate Local Dockerfile Blueprint (Anular archivo viejo del repositorio)
        run: |
          echo "-> Fabricando Dockerfile autonomo limpio..."
          rm -f Dockerfile
          
          echo "FROM ubuntu:22.04" > Dockerfile
          echo "ENV DEBIAN_FRONTEND=noninteractive" >> Dockerfile
          echo "RUN apt-get update && apt-get install -y build-essential ninja-build pkg-config zstd curl unzip bison flex cmake git libdrm-dev python3 python3-pip && apt-get clean" >> Dockerfile
          echo "RUN pip3 install --upgrade pip && pip3 install mako PyYAML meson ninja packaging" >> Dockerfile
          
          # Fijamos la URL real sin variables dinamicas de shell para que curl resuelva el host de Google
          echo "RUN curl -L 'https://google.com' -o ndk.zip && unzip -q ndk.zip -d /opt/ && rm -f ndk.zip" >> Dockerfile
          
          echo "ENV NDK_ROOT=/opt/android-ndk-r25c" >> Dockerfile
          echo "RUN mkdir -p /root/build-config" >> Dockerfile
          echo "RUN echo '[binaries]' > /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"c = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"cpp = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"ar = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"strip = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"pkg-config = '/usr/bin/pkg-config'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"cmake = '/usr/bin/cmake'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo '[properties]' >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo 'needs_exe_wrapper = true' >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo '[host_machine]' >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"system = 'android'\" >> /root/build-config/cross_file.txt" >> Device_config
          echo "RUN echo \"system = 'android'\" >> /root/build-config/cross_file.txt" >> /root/build-config/cross_file.txt
          echo "RUN echo \"cpu_family = 'aarch64'\" >> /root/build-config/cross_file.txt" >> /root/build-config/cross_file.txt
          echo "RUN echo \"cpu = 'armv8-a'\" >> /root/build-config/cross_file.txt" >> /root/build-config/cross_file.txt
          echo "RUN echo \"endian = 'little'\" >> /root/build-config/cross_file.txt" >> /root/build-config/cross_file.txt
          
          # Limpieza final del script de comandos repetidos de cross_file
          cat << 'EOF' > /root/build-config/cross_file.txt || true
          [binaries]
          c = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          cmake = '/usr/bin/cmake'
          [properties]
          needs_exe_wrapper = true
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF
          
          # Inyectamos el cargador limpio final dentro del Dockerfile
          echo "RUN mkdir -p /root/build-config" >> Dockerfile
          echo "RUN echo '[binaries]' > /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"c = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"cpp = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"ar = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"strip = '/opt/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"pkg-config = '/usr/bin/pkg-config'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"cmake = '/usr/bin/cmake'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo '[properties]' >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo 'needs_exe_wrapper = true' >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo '[host_machine]' >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"system = 'android'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"cpu_family = 'aarch64'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"cpu = 'armv8-a'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "RUN echo \"endian = 'little'\" >> /root/build-config/cross_file.txt" >> Dockerfile
          echo "WORKDIR /workspace" >> Dockerfile
          echo "ENTRYPOINT [\"/bin/bash\", \"-c\", \"meson setup \$1 --cross-file /root/build-config/cross_file.txt -Dbuildtype=release -Dplatforms=android -Dandroid-stub=true -Dvulkan-drivers=wrapper -Dgallium-drivers= -Dopengl=false -Dgbm=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dllvm=disabled -Dzstd=disabled -Dxmlconfig=disabled && meson compile -C \$1\"]" >> Dockerfile
          
          echo "-> Dockerfile autonomo limpio verificado con exito:"
          cat Dockerfile

      # CONSTRUIMOS TU PROPIO CONTENEDOR CON LA RUTA DE GOOGLE TOTALMENTE LIMPIA
      - name: Build Custom Unisoc Wrapper Image
        run: |
          echo "-> Construyendo imagen local con el nuevo nombre: ${{ env.CUSTOM_TAG }}"
          docker build -t ${{ env.CUSTOM_TAG }} .

      # CORREMOS TU DOCKER PASÁNDOLE EL NOMBRE DEL DIRECTORIO DE SALIDA CON LA RED CAPADA
      - name: Execute Custom Unisoc Wrapper Compiler
        run: |
          echo "-> Arrancando compilacion cruzada offline en contenedor propio..."
          docker run --rm \
            --network none \
            -v "${{ github.workspace }}:/workspace" \
            ${{ env.CUSTOM_TAG }} ${{ env.BUILD_DIR }}

      # RECOLECTAMOS EL ARCHIVO COMPILADO Y GENERAMOS LA ESTRUCTURA EXACTA PARA BANNERLATOR
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Localizando el bionic driver compilado..."
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          fi
          
          echo "-> Inyectando manifiesto JSON ICD oficial original..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": { "api_version": "1.3.289", "library_path": "libvulkan_wrapper.so" },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Custom-Unisoc-Wrapper
          path: wrapper.tzst

          if-no-files-found: error
