name: Build GameNative Wrapper Multi-Arch

on:
  push:
    branches: [ main, wrapper-25 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-export:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Arm32 and Arm64 via Docker
      run: |
        docker build --target final -t gamenative-compiled .

    - name: Extract Compiled Libraries
      run: |
        docker run --name container-extract gamenative-compiled
        docker cp container-extract:/dist/gamenative-wrappers.tar.gz ./gamenative-wrappers.tar.gz
        tar -xzvf gamenative-wrappers.tar.gz

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gamenative-wrapper-binaries
        path: |
          lib/armeabi-v7a/libvulkan_wrapper.so
          lib/arm64-v8a/libvulkan_wrapper.so
