name: Mesa Bionic Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # ¡PASO CORREGIDO: Paréntesis emparejado correctamente dentro de la función de reemplazo de Expat!
      - name: Bypass SPIRV-Tools and Expat (Surgical Patch)
        run: |
          python3 -c "import os; t='src/vulkan/wrapper/meson.build'; f=open(t,'r') if os.path.exists(t) else None; c=f.read().replace('SPIRV-Tools-opt','m').replace('SPIRV-Tools','m') if f else ''; f.close() if f else None; f=open(t,'w') if f else None; f.write(c) if f else None; f.close() if f else None"
          python3 -c "import os; t='meson.build'; f=open(t,'r') if os.path.exists(t) else None; c=f.read().replace(\"dependency('expat')\",\"dependency('m')\") if f else ''; f.close() if f else None; f=open(t,'w') if f else None; f.write(c) if f else None; f.close() if f else None"

      # ¡INYECTOR HÍBRIDO TOTALMENTE COMPRIMIDO PARA SALVAR LOS 32 BITS!
      - name: Surgical Silicon Modification (Anti-Overflow & 32-bit Safe Fix)
        run: |
          python3 -c "import os; t='src/vulkan/wrapper/wrapper_device.c'; f=open(t,'r') if os.path.exists(t) else None; c='\n#include <stdint.h>\nextern int mallopt(int p, int v);\nextern int setenv(const char* n, const char* v, int o);\n'+f.read().replace('vk_icdGetInstanceProcAddr','mallopt(-1002,0);setenv(\"MESA_VK_WSI_PRESENT_MODE\",\"mailbox\",1);setenv(\"vblank_mode\",\"0\",1);if(sizeof(void*)==4){setenv(\"MESA_VK_WSI_QUEUE_SIZE\",\"1\",1);}vk_icdGetInstanceProcAddr',1) if f else ''; f.close() if f else None; f=open(t,'w') if f else None; f.write(c) if f else None; f.close() if f else None"

      - name: Create Ninja Wrapper Hijacker
        run: |
          mkdir -p bin_hijack
          cat << 'EOF' > bin_hijack/ninja
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
            if [ "$arg" == "src/vulkan/wrapper/libvulkan_wrapper.so" ]; then
              NEW_ARGS+=("vulkan_wrapper")
            else
              NEW_ARGS+=("$arg")
            fi
          done
          exec /usr/local/bin/ninja "${NEW_ARGS[@]}"
          EOF
          chmod +x bin_hijack/ninja

      # CAPAMOS LA RED CON --NETWORK NONE EN TU COMANDO DOCKER ORIGINAL
      - name: compilador-envoltorio
        run: |
          docker run --rm \
            --network none \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      - name: Structure and Pack wrapper.tzst
        run: |
          mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          fi
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": { "api_version": "1.3.289", "library_path": "libvulkan_wrapper.so" },
              "file_format_version": "1.0.0"
          }
          EOF
          cd pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Bionic-Mali-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
