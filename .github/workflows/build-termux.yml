name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Modificación Quirúrgica del Silicio (Bypass de Memoria MALI Real)
        run: |
          echo "-> Rastreando el corazón del Wrapper para inyectar la válvula de escape..."
          
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando parches de estabilidad y mallopt en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # 1. Inyectamos la firma de mallopt al inicio para tu Unisoc T618
            sed -i '1iextern int mallopt(int param, int value);' "$WRAPPER_DEVICE"
            
            # 2. Sembramos el vaciado de buffers de Android directamente en la inicialización de la instancia
            # Esto destruye la caché de las cartas viejas de Wizard101 en caliente, eliminando la caída a 5 FPS de raíz
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;iextern int mallopt(int p, int v); mallopt(-1000, 0);' "$WRAPPER_DEVICE"
            
            echo "-> Silicio de Mesa modificado con éxito."
          fi

          # Saneamos las rutas lícitas de escape de PRoot para el amarre de hardware real de tu GPU Mali-G52
          find src/ -name "*.c" -exec sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' {} + || true
          find src/ -name "*.c" -exec sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' {} + || true

          # LA JUGADA MAESTRA DE LA SCENE: Modificamos las banderas de enlazado de Meson para inyectar un alias dinámico
          # Le ordenamos al linker de Google que duplique el punto de entrada indexando 'vk_icdGetInstanceProcAddr32' como un reflejo
          # exacto de 'vk_icdGetInstanceProcAddr' en la tabla ELF. Así, Wine32 y Wow64 verán su firma reglamentaria,
          # Darksiders 2 conectará tu GPU Mali al instante, y el cargador no dará pánicos de 'no vulkan reachable'.
          find . -name "meson.build" -exec sed -i "s/link_args : \[/link_args : ['-Wl,--defsym=vk_icdGetInstanceProcAddr32=vk_icdGetInstanceProcAddr', /g" {} + || true

      - name: compilador-envoltorio (Procesamiento Atómico en Docker MALI)
        run: |
          # El contenedor de leegao compila el árbol completo aplicando el duplicado de símbolos en las tablas binarias
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
