name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Modificación Quirúrgica del Silicio (Arreglo Total de 32 Bits MALI)
        run: |
          echo "-> Rastreando el corazón del Wrapper para reparar los 32 bits huérfanos..."
          
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando parches de arquitectura dual y mallopt en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # 1. Inyectamos el prototipo de mallopt al inicio para la estabilidad en el Unisoc T618
            sed -i '1iextern int mallopt(int param, int value);' "$WRAPPER_DEVICE"
            
            # 2. Reparamos el punto de entrada inyectando la purga de memoria de Bionic en 64 bits
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;iextern int mallopt(int p, int v); mallopt(-1000, 0);' "$WRAPPER_DEVICE"
            
            # 3. LA JUGADA MAESTRA DE CIERRE: Inyectamos el prototipo de la función (void* vk_icdGetInstanceProcAddr32...) 
            # una linea antes de su cuerpo para satisfacer la regla estricta -Wmissing-prototypes de Clang.
            # Darksiders 2 y Wow64 localizarán el driver de tu GPU Mali-G52 al instante, destruyendo el 1 FPS.
            printf "\n\nvoid* vk_icdGetInstanceProcAddr32(void* instance, const char* pName);\n\n__attribute__((visibility(\"default\"))) void* vk_icdGetInstanceProcAddr32(void* instance, const char* pName) {\n    extern int mallopt(int p, int v);\n    mallopt(-1000, 0);\n    return vk_icdGetInstanceProcAddr(instance, pName);\n}\n" >> "$WRAPPER_DEVICE"
            
            echo "-> Canal simétrico de 32 bits y prototipo soldados con éxito en el silicio de Mesa."
          fi

          # Saneamos las redirecciones lícitas de PRoot para ambas arquitecturas en los cargadores compartidos
          find src/ -name "*.c" -exec sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' {} + || true
          find src/ -name "*.c" -exec sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' {} + || true

      - name: compilador-envoltorio (Procesamiento Atómico en Docker MALI)
        run: |
          # El contenedor de leegao compila el árbol completo con las nuevas tablas duales indexadas
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
