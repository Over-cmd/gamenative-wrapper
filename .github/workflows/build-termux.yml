name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: wrapper-compiler

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión Zstd en el servidor de GitHub
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      # CONSTRUCCIÓN LOCAL DE TU IMAGEN DOCKER MULTIARCH
      - name: Build Local Multiarchitecture Docker Image
        run: |
          echo "-> Compilando entorno Docker universal a partir de tu archivo..."
          docker build -t ${{ env.IMAGE_TAG }}:latest .

      # UN SOLO DISPARO DE DOCKER: El contenedor se encarga de empaquetar 32 dentro de 64 bits automáticamente
      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }}:latest ${{ env.BUILD_DIR }}

      # ESTE PASO CREA LA ESTRUCTURA ORIGINAL EN RUTA ÚNICA EXIGIDA POR BANNERLATOR
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo el único driver híbrido unificado compilado a usr/lib..."
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando un único manifiesto JSON ICD oficial..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura en formato wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper-FatBinary
          path: wrapper.tzst
          if-no-files-found: error
