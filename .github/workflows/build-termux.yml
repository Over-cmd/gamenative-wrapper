      # INYECCIÓN CORREGIDA CON DECLARACIÓN STATIC PARA EVITAR -Wmissing-prototypes
      - name: Surgical Silicon Modification (Anti-Overflow MALI Hybrid 32/64 Injection)
        run: |
          echo "-> Rastreando el corazon del Wrapper para soldar compatibilidad hibrida Vulkan..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Rompiendo el cuello de botella de la CPU en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Definir el bloque de código C incluyendo 'static'
            read -r -d '' C_CODE << 'EOF' || true
            extern int mallopt(int param, int value);
            extern int setenv(const char *name, const char *value, int overwrite);
            
            #ifndef MALI_OPT_INJECTED
            #define MALI_OPT_INJECTED
            // Añadido 'static' para cumplir con las reglas estrictas de compilación de Mesa
            static void __attribute__((constructor)) init_mali_optimization(void) {
                mallopt(-1002, 0);
                setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
                setenv("vblank_mode", "0", 1);
                setenv("mesa_glthread", "true", 1);
                setenv("VK_MULTITHREAD", "1", 1);
                setenv("MESA_VK_WSI_QUEUE_SIZE", "2", 1);
            }
            #endif
          EOF
            
            # Inyectar el código limpiamente al principio del archivo fuente
            echo "$C_CODE" | cat - "$WRAPPER_DEVICE" > temp && mv temp "$WRAPPER_DEVICE"
            echo "-> Envoltura hibrida optimizada inyectada con exito."
          else
            echo "-> Archivo wrapper_device.c no encontrado en src/. Aplicando fallback en main.c..."
            MAIN_FILE=$(find src/ -name "main.c" | head -n 1)
            if [ -n "$MAIN_FILE" ]; then
               echo "Inyectando optimizaciones en punto alternativo: $MAIN_FILE"
               echo "extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); static void __attribute__((constructor)) init_mali(void){ mallopt(-1002,0); setenv(\"MESA_VK_WSI_PRESENT_MODE\",\"mailbox\",1); setenv(\"vblank_mode\",\"0\",1); setenv(\"mesa_glthread\",\"true\",1); setenv(\"VK_MULTITHREAD\",\"1\",1); setenv(\"MESA_VK_WSI_QUEUE_SIZE\",\"2\",1); }" | cat - "$MAIN_FILE" > temp && mv temp "$MAIN_FILE"
            else
               echo "-> No se encontraron puntos de entrada de código C válidos."
            fi
          fi
