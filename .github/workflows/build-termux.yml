name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión Zstd en el servidor de GitHub
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # PARCHE MAESTRO: Rompe la rigidez estructural de Over-cmd para salvar la carga en juegos de 32 bits
      - name: Fix Over-cmd Meson Rigidity (Anti-Crash 32bit Load)
        run: |
          echo "-> Analizando scripts de construcción de Mesa para inyectar compatibilidad inline..."
          python3 -c "
          import os
          target = 'src/vulkan/wrapper/meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              # Modificamos los argumentos de C en el build para forzar la compatibilidad de alineación
              if 'c_args' in content:
                  content = content.replace(\"c_args : [\", \"c_args : ['-D__inline__=', \")
                  with open(target, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('-> ¡Alineación de emulación inline inyectada en Meson correctamente!')
          "

      # REESCRITURA QUIRÚRGICA EN C: Interceptamos modificando el cuerpo real de vk_icdGetInstanceProcAddr
      - name: Surgical Silicon Modification (Anti-Overflow MALI Hybrid 32/64 Injection)
        run: |
          echo "-> Ejecutando script de bypass quirúrgico para unificar puntos de entrada..."
          python3 -c "
          import os
          
          # 1. Buscamos y renombramos la función en wrapper_device.c si existe
          dev_path = 'src/vulkan/wrapper/wrapper_device.c'
          if os.path.exists(dev_path):
              with open(dev_path, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              new_lines = []
              for line in lines:
                  if 'vk_icdGetInstanceProcAddr' in line and ('void*' in line or 'PFN_vkVoidFunction' in line) and '{' in line:
                      line = line.replace('vk_icdGetInstanceProcAddr', 'ignored_device_vk_icdGetInstanceProcAddr')
                  new_lines.append(line)
              with open(dev_path, 'w', encoding='utf-8') as f:
                  f.writelines(new_lines)
                  
          # 2. Buscamos wrapper_instance.c para inyectar nuestro interceptor maestro directamente en su lugar nativo
          inst_path = 'src/vulkan/wrapper/wrapper_instance.c'
          if os.path.exists(inst_path):
              with open(inst_path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              # Renombramos la implementación nativa que está causando la colisión
              old_func = 'VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL\nvk_icdGetInstanceProcAddr(VkInstance instance, const char *pName)'
              fallback_func = 'VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL\nvk_icdGetInstanceProcAddr(VkInstance instance, const char* pName)'
              
              if old_func in content:
                  content = content.replace(old_func, 'VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL\noriginal_vk_icdGetInstanceProcAddr(VkInstance instance, const char *pName)')
              elif fallback_func in content:
                  content = content.replace(fallback_func, 'VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL\noriginal_vk_icdGetInstanceProcAddr(VkInstance instance, const char* pName)')
              else:
                  # Fallback genérico si tiene otro formato de espacios/punteros
                  content = content.replace('vk_icdGetInstanceProcAddr(VkInstance', 'original_vk_icdGetInstanceProcAddr(VkInstance')
              
              # Añadimos nuestro interceptor maestro universal al final de wrapper_instance.c
              bridge_code = '''
  #include <string.h>
  extern int mallopt(int param, int value);
  extern int setenv(const char *name, const char *value, int overwrite);
  VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL original_vk_icdGetInstanceProcAddr(VkInstance instance, const char *pName);

  VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL vk_icdGetInstanceProcAddr(VkInstance instance, const char *pName) {
      mallopt(-1002, 0);
      setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
      setenv("vblank_mode", "0", 1);
      
      if (sizeof(void*) == 4) {
          setenv("MESA_VK_WSI_QUEUE_SIZE", "1", 1);
          setenv("BOX86_EMULATED_LIBS", "libvulkan_wrapper.so", 1);
          setenv("BOX86_MMAP32", "1", 1);
          
          if (pName && (strcmp(pName, "vkGetPhysicalDeviceProperties2KHR") == 0 || 
                        strcmp(pName, "vkGetPhysicalDeviceFeatures2KHR") == 0 ||
                        strcmp(pName, "vkRegisterDeviceCustomCallbacksEXT") == 0)) {
              return (PFN_vkVoidFunction)NULL;
          }
      }
      return original_vk_icdGetInstanceProcAddr(instance, pName);
  }
  '''
              with open(inst_path, 'w', encoding='utf-8') as f:
                  f.write(content + '\n' + bridge_code)
              print('-> ¡Inyección modular completada con éxito en wrapper_instance.c!')
          "

      # COMPILACIÓN ORIGINAL DEL DOCKER NATIVO INTACTA
      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # ¡ESTE PASO CREA LOS MANIFIESTOS DUALES EXIGIDOS POR BOX86 Y BOX64 PARA BANNERLATOR!
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo el driver compilado a usr/lib..."
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura dual en formato wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
