name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches:
      - main
      - master
      - wrapper-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_DIR: compilacion

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión nativas en el host de ejecución
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      # INYECCIÓN DIRECTA EN EL REPOSITORIO ANTES DE COMPILAR EN EL CONTENEDOR
      - name: Surgical Silicon Modification (Anti-Overflow MALI Hybrid 32/64 Injection)
        run: |
          echo "-> Rastreando el corazon del Wrapper para soldar compatibilidad hibrida Vulkan..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Rompiendo el cuello de botella de la CPU en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Definir el bloque de código C de inicialización limpia
            read -r -d '' C_CODE << 'EOF' || true
            extern int mallopt(int param, int value);
            extern int setenv(const char *name, const char *value, int overwrite);
            
            // Inyección optimizada para Unisoc T618 / Mali (Fijación 0-7 FPS Activision)
            void __attribute__((constructor)) init_mali_optimization() {
                mallopt(-1002, 0);
                setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
                setenv("vblank_mode", "0", 1);
                setenv("mesa_glthread", "true", 1);
                setenv("VK_MULTITHREAD", "1", 1);
                setenv("MESA_VK_WSI_QUEUE_SIZE", "2", 1);
            }
          EOF
            
            # Inyectar el código limpiamente al principio del archivo fuente del repositorio
            echo "$C_CODE" | cat - "$WRAPPER_DEVICE" > temp && mv temp "$WRAPPER_DEVICE"
            echo "-> Envoltura hibrida optimizada inyectada con exito."
          else
            echo "-> Archivo wrapper_device.c no encontrado en src/. Aplicando fallback en archivos de cabecera..."
            # Intentar fallback seguro en main.c si existe
            MAIN_FILE=$(find src/ -name "main.c" | head -n 1)
            if [ -n "$MAIN_FILE" ]; then
               echo "Inyectando optimizaciones en el punto de entrada alternativo: $MAIN_FILE"
               echo "extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); void __attribute__((constructor)) init_mali(){ mallopt(-1002,0); setenv(\"MESA_VK_WSI_PRESENT_MODE\",\"mailbox\",1); setenv(\"vblank_mode\",\"0\",1); setenv(\"mesa_glthread\",\"true\",1); setenv(\"VK_MULTITHREAD\",\"1\",1); setenv(\"MESA_VK_WSI_QUEUE_SIZE\",\"2\",1); }" | cat - "$MAIN_FILE" > temp && mv temp "$MAIN_FILE"
            else
               echo "-> No se encontraron puntos de entrada de código C válidos para inyección."
            fi
          fi

      # COMPILACIÓN USANDO TU CONTENEDOR ORIGINAL NATIVO
      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # REESTRUCTURACIÓN DE CONTENEDOR EN FORMATO COMPATIBLE CON BANNERLATOR (USR/LIB/.TZST)
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo el driver compilado por el contenedor a usr/lib..."
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura dual en formato wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-T618-Wrapper-Fat-Zstd
          path: wrapper.tzst
          if-no-files-found: error
