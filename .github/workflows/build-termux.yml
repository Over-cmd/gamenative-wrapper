name: Forja Monolítica MALI T618 Unificado Multiarch Real

on:
  workflow_dispatch:

jobs:
  build-mali-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio Principal
        uses: actions/checkout@v4

      - name: Activar Android NDK Nativo del Servidor (Cero Descargas)
        run: |
          NDK_SERVER_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          if [ -z "$NDK_SERVER_PATH" ]; then
            NDK_SERVER_PATH="/usr/local/lib/android/sdk/ndk-bundle"
          fi
          echo "-> Utilizando Android NDK lícito del sistema: $NDK_SERVER_PATH"
          echo "ANDROID_NDK_LATEST_HOME=$NDK_SERVER_PATH" >> $GITHUB_ENV

      - name: Configurar Código Fuente C Multiarch (Bypass Bionic MALI)
        run: |
          mkdir -p src_wrapper
          
          # Escribimos el interceptor dinámico puro original de la scene con la válvula mallopt de Android
          cat << 'EOF' > src_wrapper/wrapper.c
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <unistd.h>
          
          // Declaramos la directiva mallopt nativa para forzar la purga de buffers en Android Bionic
          extern int mallopt(int param, int value);

          void* (*real_vk_init)(void*, const char*) = NULL;

          __attribute__((visibility("default"))) void* vk_icdGetInstanceProcAddr(void* instance, const char* pName) {
              if (!real_vk_init) {
                  void* handle = NULL;
                  
                  // DETECCIÓN DINÁMICA DE ARQUITECTURA EN TIEMPO REAL (Bypass Wow64)
                  if (sizeof(void*) == 8) {
                      // Pasillo de 64 bits a través del host de PRoot de Bannerlator
                      handle = dlopen("/host-rootfs/system/lib64/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/system/lib64/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/host-rootfs/vendor/lib64/hw/vulkan.mali.so", RTLD_NOW | RTLD_GLOBAL);
                  } else {
                      // Pasillo de 32 bits independiente para juegos clásicos (Wizard101 / Darksiders 2)
                      handle = dlopen("/host-rootfs/system/lib/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/system/lib/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
                      if (!handle) handle = dlopen("/host-rootfs/vendor/lib/hw/vulkan.mali.so", RTLD_NOW | RTLD_GLOBAL);
                  }
                  
                  if (!handle) handle = dlopen("libvulkan.so.1", RTLD_NOW | RTLD_GLOBAL);
                  if (handle) real_vk_init = (void* (*)(void*, const char*))dlsym(handle, "vk_icdGetInstanceProcAddr");
              }
              
              // LA VÁLVULA DE ESCAPE REAL BIONIC: Obliga al procesador a purgar la memoria caché de texturas viejas de las cartas de Wizard101
              // Esto vacía los buffers inmediatamente en tu GPU Mali-G52 MP2, eliminando los tirones y congelamientos
              mallopt(-1000, 0); 
              
              if (real_vk_init) return real_vk_init(instance, pName);
              return NULL;
          }
          EOF

      - name: Compilación Cruzada Limpia (Doble Prensa del NDK de Google)
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          
          # Creamos la estructura multiarch reglamentaria que exige el RootFS de tu emulador
          mkdir -p wrapper_output/usr/lib/aarch64-linux-gnu
          mkdir -p wrapper_output/usr/lib/arm-linux-gnueabi
          mkdir -p wrapper_output/usr/share/vulkan/icd.d
          
          echo "-> Prensando el carril legítimo de 64 bits compartidos..."
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 \
              src_wrapper/wrapper.c -o wrapper_output/usr/lib/aarch64-linux-gnu/libvulkan_wrapper.so -ldl -llog

          echo "-> Prensando el carril legítimo de 32 bits (Multiarch) para destruir la pantalla negra..."
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang -shared -fPIC -O3 \
              src_wrapper/wrapper.c -o wrapper_output/usr/lib/arm-linux-gnueabi/libvulkan_wrapper.so -ldl -llog

          echo "-> Despojando tablas de depuración con LLVM Strip..."
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all wrapper_output/usr/lib/aarch64-linux-gnu/libvulkan_wrapper.so
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all wrapper_output/usr/lib/arm-linux-gnueabi/libvulkan_wrapper.so

          echo "-> Generando el Manifiesto ICD JSON universal de Khronos..."
          printf '{\n    "file_format_version": "1.0.0",\n    "ICD": {\n        "library_path": "libvulkan_wrapper.so",\n        "api_version": "1.1.0"\n    }\n}\n' > wrapper_output/usr/share/vulkan/icd.d/icd_wrapper.json

      - name: Empaquetar Estructura Multiarch en Compresión Zstd
        run: |
          tar -cf wrapper.tar -C wrapper_output usr
          zstd -19 --rm wrapper.tar -o wrapper.tzst

      - name: Subir Driver Monolítico Multiarch a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vulkan-mali-t618-definitivo
          path: "**/wrapper.tzst"
          compression-level: 0
