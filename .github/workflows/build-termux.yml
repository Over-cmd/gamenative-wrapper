name: Mesa Bionic Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR_64: compilacion_64
  BUILD_DIR_32: compilacion_32
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-universal-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # Parches quirúrgicos de derivación de librerías para Mesa
      - name: Bypass SPIRV-Tools and Expat Requirements (Python Surgical Patch)
        run: |
          echo "-> Ejecutando inyector de dependencias por script Python..."
          python3 -c "
          import os
          target = 'src/vulkan/wrapper/meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n').replace(\"find_library('SPIRV-Tools-opt')\", \"find_library('m')\").replace(\"find_library('SPIRV-Tools-opt',\", \"find_library('m',\").replace(\"find_library('SPIRV-Tools')\", \"find_library('m')\").replace(\"find_library('SPIRV-Tools',\", \"find_library('m',\")
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
          "
          python3 -c "
          import os
          target = 'meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n').replace(\"dependency('expat'\", \"dependency('m'\").replace(\"dependency('expat',\", \"dependency('m',\")
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
          "

      # INTERCEPCIÓN AVANZADA: Despachador de funciones compatible con GameNative
      - name: GameNative Adaptive Hook Injection
        run: |
          echo "-> Inyectando pasarela dinámica de punteros para GameNative..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Cambiamos el nombre de la función original en el código fuente para poder interceptarla de forma limpia
            sed -i 's/vk_icdGetInstanceProcAddr/original_vk_icdGetInstanceProcAddr/g' "$WRAPPER_DEVICE"
            
            # Agregamos la lógica inteligente al final del archivo para resolver punteros en 32 bits
            cat <<-'EOF' >> "$WRAPPER_DEVICE"
            
            #include <dlfcn.h>
            extern int mallopt(int param, int value);
            extern int setenv(const char *name, const char *value, int overwrite);
            extern void* original_vk_icdGetInstanceProcAddr(void* instance, const char* pName);
            
            // Punto de entrada único universal que respeta las llamadas estrictas de GameNative
            void* vk_icdGetInstanceProcAddr(void* instance, const char* pName) {
                // Forzar optimizaciones Mali Unisoc de forma global preventiva
                mallopt(-1002, 0);
                setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
                setenv("vblank_mode", "0", 1);
                
                // Si GameNative ejecuta este binario en un hilo / proceso de 32 bits:
                if (sizeof(void*) == 4) {
                    static void* h32 = NULL;
                    if (!h32) {
                        h32 = dlopen("/usr/lib/libvulkan_wrapper32.so", RTLD_LAZY | RTLD_GLOBAL);
                    }
                    if (h32) {
                        void* (*proc32)(void*, const char*) = (void* (*)(void*, const char*))dlsym(h32, "vk_icdGetInstanceProcAddr");
                        if (proc32) {
                            return proc32(instance, pName); // Redirección en caliente de la tabla Vulkan
                        }
                    }
                }
                
                // Si es de 64 bits, continúa por la ejecución normal del Wrapper nativo
                return original_vk_icdGetInstanceProcAddr(instance, pName);
            }
          EOF
            echo "-> ¡Pasarela dinámica C soldada con éxito!"
          fi

      - name: Create Ninja Wrapper Hijacker
        run: |
          mkdir -p bin_hijack
          cat << 'EOF' > bin_hijack/ninja
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
            if [ "$arg" == "src/vulkan/wrapper/libvulkan_wrapper.so" ]; then
              NEW_ARGS+=("vulkan_wrapper")
            else
              NEW_ARGS+=("$arg")
            fi
          done
          exec /usr/local/bin/ninja "${NEW_ARGS[@]}"
          EOF
          chmod +x bin_hijack/ninja

      - name: Compilar 64 bits
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            -e TARGET_ARCH=aarch64 \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR_64 }}

      - name: Compilar 32 bits
        run: |
          rm -rf meson-private meson-logs meson-info || true
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            -e TARGET_ARCH=arm \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR_32 }}

      - name: Structure and Pack final .tzst
        run: |
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          # Guardamos la pasarela dinámica de 64 bits con el nombre maestro que busca GameNative
          SO_64=$(find ${{ env.BUILD_DIR_64 }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          cp "$SO_64" pkg/usr/lib/libvulkan_wrapper.so
          
          # Guardamos la de 32 bits oculta para ser invocada internamente desde el Hook de C
          SO_32=$(find ${{ env.BUILD_DIR_32 }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          cp "$SO_32" pkg/usr/lib/libvulkan_wrapper32.so

          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final Package
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-Mali-Universal-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
