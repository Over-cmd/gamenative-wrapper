name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: wrapper-compiler

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión Zstd en el servidor de GitHub
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # PASO CLAVE PIPETTO-STYLE: Forzamos que Over-cmd exponga el símbolo de interfaz ICD que Box86 exige
      - name: Inject Khronos ICD Interface Symbol (Pipetto-crypto Mirror Trick)
        run: |
          echo "-> Sincronizando la tabla de símbolos con el estándar de Pipetto-crypto..."
          python3 -c "
          import os
          for root, dirs, files in os.walk('src/vulkan/wrapper'):
              for file in files:
                  if file.endswith('.def') or file.endswith('.map') or file == 'meson.build':
                      target = os.path.join(root, file)
                      with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      if 'vk_icdGetInstanceProcAddr' in content:
                          content = content.replace('vk_icdGetInstanceProcAddr', 'vk_icdGetInstanceProcAddr\n    vk_icdNegotiateLoaderICDInterfaceVersion')
                          with open(target, 'w', encoding='utf-8') as f:
                              f.write(content)
          "

      # PARCHE MAESTRO ANTI-DEPENDENCIAS: Neutralizamos libatomic, libdl, librt, libm y libdrm en meson.build
      - name: Bypass Meson Rigid Requirements (Bypass Libdrm & Math)
        run: |
          echo "-> Forzando la neutralización de dependencias ausentes en el script de Meson..."
          python3 -c "
          import os
          target = 'meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              # 1. Neutralizamos las búsquedas de librerías del sistema obsoletas o unificadas en Android
              content = content.replace(\"compiler.find_library('atomic'\", \"null_dep #\")
              content = content.replace(\"cc.find_library('atomic'\", \"null_dep #\")
              content = content.replace(\"compiler.find_library('dl'\", \"null_dep #\")
              content = content.replace(\"cc.find_library('dl'\", \"null_dep #\")
              content = content.replace(\"compiler.find_library('rt'\", \"null_dep #\")
              content = content.replace(\"cc.find_library('rt'\", \"null_dep #\")
              
              # 2. Neutralizamos el bloqueo de la librería matemática central 'm'
              content = content.replace(\"compiler.find_library('m'\", \"null_dep #\")
              content = content.replace(\"cc.find_library('m'\", \"null_dep #\")
              
              # 3. Forzamos de manera quirúrgica que la dependencia obligatoria de libdrm pase como opcional o simulada
              content = content.replace(\"dependency('libdrm'\", \"null_dep #\")
              content = content.replace(\"dependency('libdrm',\", \"null_dep #\")
              
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('-> ¡Todas las barreras rígidas de dependencias externas han sido eliminadas!')
          "

      # TU INYECCIÓN DE CONTROL DE FLUJO HÍBRIDO ORIGINAL (CONSERVA TU CONFIGURACIÓN DEL HUD)
      - name: Surgical Silicon Modification (Anti-Overflow MALI Hybrid 32/64 Injection)
        run: |
          echo "-> Rastreando el corazon del Wrapper para soldar compatibilidad hibrida Vulkan..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Aplicando parches de alineacion de memoria de 32 bits en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            sed -i '1i#include <stdint.h>' "$WRAPPER_DEVICE"
            sed -i '1iextern int mallopt(int param, int value);' "$WRAPPER_DEVICE"
            sed -i '1iextern int setenv(const char *name, const char *value, int overwrite);' "$WRAPPER_DEVICE"
            
            # Inyectamos mallopt(-1002, 0), mailbox y forzamos estabilidad de buffer en procesos de 32 bits
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;i\\ extern int mallopt(int p, int v);\\n extern int setenv(const char *n, const char *v, int o);\\n mallopt(-1002, 0);\\n setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);\\n setenv("vblank_mode", "0", 1);\\n if (sizeof(void*) == 4) {\\n   setenv("MESA_VK_WSI_QUEUE_SIZE", "1", 1);\\n }' "$WRAPPER_DEVICE"
            echo "-> Envoltura hibrida inyectada con exito."
          else
            echo "-> Archivo wrapper_device.c no encontrado, aplicando fallback hibrido global..."
            find src/ -name "*.c" -exec sed -i 's/vk_icdGetInstanceProcAddr/extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1); setenv("vblank_mode", "0", 1); if (sizeof(void*) == 4) { setenv("MESA_VK_WSI_QUEUE_SIZE", "1", 1); } vk_icdGetInstanceProcAddr/g' {} + || true
          fi

      # CONSTRUCCIÓN EN VIVO DEL DOCKERFILE UNIVERSAL CORREGIDO ANTERIOR
      - name: Build Local Corrected Docker Image
        run: |
          echo "-> Creando imagen de compilación a partir de tu archivo de printf..."
          docker build -t ${{ env.IMAGE_TAG }}:latest .

      # COMPILACIÓN DEL DOCKER NATIVO CON PARCHE INTEGRADO
      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} :latest ${{ env.BUILD_DIR }}

      # MANIFIESTOS DUALES IDENTICOS A PIPETTO PARA ENGAÑAR A BOX86
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo el único driver de 64 bits compilado a usr/lib..."
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura dual en formato wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado híbrido completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper-Universal
          path: wrapper.tzst
          if-no-files-found: error
