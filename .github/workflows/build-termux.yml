name: Compilación Termux Oficial con nuestro propio Docker Wrapper Unisoc 

on:
push:
branches: [ "main", "master", "wrapper-25" ]
workflow_dispatch: 

env:
BUILD_DIR_64: b_64
BUILD_DIR_32: b_32
CUSTOM_TAG: gamenative-unisoc-builder:latest 

jobs:
build-driver:
runs-on: ubuntu-latest 

steps:

* name: Código de pago
uses: actions/checkout@v4
with:
submodules: 'recursive'
* name: Configurar Docker Buildx
uses: docker/setup-buildx-action@v3
* name: Instalar herramientas de compresión
run: |
sudo apt-get update
sudo apt-get install -y zstd python3
chmod +x generate_configs.sh generate_dockerfile.sh
* name: Inyección Quirúrgica Silicio (Modo Fluido 32/64 bits)
run: python3 patch_mesa.py
* name: Assemble Offline Compiler Scripts
run: ./generate_configs.sh
* name: Generate Local Dockerfile Blueprint
run: ./generate_dockerfile.sh
* name: Build Custom Unisoc Wrapper Image
run: docker build -t ${{ env.CUSTOM_TAG }} .
* name: Execute Custom Unisoc Wrapper Compiler (64-bit)
run: docker run --rm -e ARCH=aarch64 -v "${{ github.workspace }}:/workspace" 

env.CUSTOMTAGe n v point cap C cap U cap S cap T cap O cap M sub cap T cap A cap G
𝑒𝑛𝑣.𝐶𝑈𝑆𝑇𝑂𝑀𝑇𝐴𝐺
{{ env.BUILD_DIR_64 }}
* name: Execute Custom Unisoc Wrapper Compiler (32-bit)
run: docker run --rm -e ARCH=arm -v "${{ github.workspace }}:/workspace" 

env.CUSTOMTAGe n v point cap C cap U cap S cap T cap O cap M sub cap T cap A cap G
𝑒𝑛𝑣.𝐶𝑈𝑆𝑇𝑂𝑀𝑇𝐴𝐺
{{ env.BUILD_DIR_32 }}
* name: Compile and Link Unified Multiarch Bridge
run: |
mkdir -p unified_out
N_PATH=(docker run --rm --entrypoint /bin/bash {{ env.CUSTOM_TAG }} -c 'find /home/builder/lib -maxdepth 2 -name "android-ndk*" 2>/dev/null | head -n 1')
docker run --rm -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash 

env.CUSTOMTAG−c"e n v point cap C cap U cap S cap T cap O cap M sub cap T cap A cap G minus c "
𝑒𝑛𝑣.𝐶𝑈𝑆𝑇𝑂𝑀𝑇𝐴𝐺−𝑐"
{N_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang -shared -fPIC -O3 /root/bridge.c -o /workspace/unified_out/libvulkan_wrapper.so -ldl"
* name: Structure and Pack wrapper.tzst
run: |
mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d
cp 

env.BUILDDIR64/libvulkanwrapper.sopkg/usr/lib/libvulkanwrapper64.so||cpe n v point cap B cap U cap I cap L cap D sub cap D cap I cap R sub 6 4 / l i b v u l k a n sub w r a p p e r point s o p k g / u s r / l i b / l i b v u l k a n sub w r a p p e r sub 6 4. s o the absolute value of  end-absolute-value  c p
𝑒𝑛𝑣.𝐵𝑈𝐼𝐿𝐷𝐷𝐼𝑅64/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟.𝑠𝑜𝑝𝑘𝑔/𝑢𝑠𝑟/𝑙𝑖𝑏/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟64.𝑠𝑜||𝑐𝑝
{{ env.BUILD_DIR_64 }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper_64.so
cp 

env.BUILDDIR32/libvulkanwrapper.sopkg/usr/lib/libvulkanwrapper32.so||cpe n v point cap B cap U cap I cap L cap D sub cap D cap I cap R sub 3 2 / l i b v u l k a n sub w r a p p e r point s o p k g / u s r / l i b / l i b v u l k a n sub w r a p p e r sub 3 2. s o the absolute value of  end-absolute-value  c p
𝑒𝑛𝑣.𝐵𝑈𝐼𝐿𝐷𝐷𝐼𝑅32/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟.𝑠𝑜𝑝𝑘𝑔/𝑢𝑠𝑟/𝑙𝑖𝑏/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟32.𝑠𝑜||𝑐𝑝
{{ env.BUILD_DIR_32 }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper_32.so
cp unified_out/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
echo '{"ICD":{"api_version":"1.3.289","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
cd pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
* name: Upload Final wrapper.tzst for Bannerlator
uses: actions/upload-artifact@v4
with:
name: Bannerlator-Termux-Unisoc-Wrapper
path: wrapper.tzst
