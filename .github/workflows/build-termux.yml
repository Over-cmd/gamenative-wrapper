name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master", "wrapper-25" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión y python en el host
      - name: Install Packager Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # ¡ESTE PASO EXTIRPA EL BLOQUE DE ADRENOTOOLS EN FORMATO MULTILÍNEA SIN DEJAR PARÉNTESIS ROTOS!
      - name: Nuclear Purge for External Repositories (Aniquilar Libadrenotools)
        run: |
          echo "-> Reescribiendo el meson.build del wrapper de forma limpia con Python..."
          TARGET_MESON="src/vulkan/wrapper/meson.build"
          if [ -f "$TARGET_MESON" ]; then
            python3 -c "
          import os, re
          target = '$TARGET_MESON'
          with open(target, 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          
          # Limpiamos formatos de linea de Windows
          content = content.replace('\r\n', '\n')
          
          # 1. Comentamos de raiz la llamada al subproyecto conflictivo de internet
          content = re.sub(r'(subproject\s*\(\s*\'libadrenotools\'\s*\))', r'# \1', content)
          
          # 2. Buscamos y borramos por completo CUALQUIER declaracion multilineas de declare_dependency de adrenotools
          # El patron busca desde 'adrenotools_dep = declare_dependency' hasta su parentesis de cierre ')', sin importar los saltos de linea
          content = re.sub(r'adrenotools_dep\s*=\s*declare_dependency\s*\((.*?)\)', '# Bloque de dependencia adrenotools eliminado', content, flags=re.DOTALL)
          
          # 3. Inyectamos variables planas, limpias y globales en la primera linea del archivo
          # Esto satisface todas las lecturas posteriores del codigo de Mesa 25 sin romper la sintaxis
          header = 'libadrenotools_dep = []\nadrenotools_subproj = meson\nadrenotools_inc = include_directories(\'.\')\nadrenotools_dep = declare_dependency()\n'
          final_content = header + content
          
          with open(target, 'w', encoding='utf-8') as f:
              f.write(final_content)
          print('-> ¡Estructura de adrenotools extirpada limpiamente sin errores de parentesis!')
          "
          fi

      # EVITA LAS 5 HORAS DE ATASCO INYECTANDO EXPAT LOCALMENTE EN MESA 25
      - name: Generate Local Minimal Expat Structure (Zero Downloads)
        run: |
          echo "-> Fabricando subproyecto Expat nativo en la raiz..."
          mkdir -p subprojects/expat/lib
          
          cat << 'EOF' > subprojects/expat/lib/expat.h
          #ifndef EXPAT_H
          #define EXPAT_H
          #define XML_STATUS_OK 1
          typedef void *XML_Parser;
          typedef char XML_Char;
          XML_Parser XML_ParserCreate(const XML_Char *encoding);
          void XML_ParserFree(XML_Parser parser);
          #endif
          EOF
          
          cat << 'EOF' > subprojects/expat/lib/expat.c
          #include "expat.h"
          XML_Parser XML_ParserCreate(const XML_Char *encoding) { return (XML_Parser)1; }
          void XML_ParserFree(XML_Parser parser) {}
          int dummy_expat_stub(void) { return 0; }
          EOF
          
          cat << 'EOF' > subprojects/expat/meson.build
          project('expat', 'c', version: '2.5.0')
          expat_inc = include_directories('lib')
          expat_lib = static_library('expat', 'lib/expat.c', include_directories: expat_inc)
          expat_dep = declare_dependency(link_with: expat_lib, include_directories: expat_inc)
          meson.override_dependency('expat', expat_dep)
          EOF
          
          cat << 'EOF' > subprojects/expat.wrap
          [wrap-file]
          directory = expat
          EOF
          echo "-> Parche de estructura de subproyectos completado de forma segura."

      # ADAPTACIÓN DE OPCIONES EXIGIDA POR EL MOTOR GAMENATIVE DE MESA 25
      - name: Patch Meson Options for GameNative Choices
        run: |
          echo "-> Desbloqueando las opciones de configuracion de la variante GameNative..."
          if [ -f "meson_options.txt" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', 'swrast', /g" meson_options.txt
          elif [ -f "meson.options" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', 'swrast', /g" meson.options
          fi

      # ¡INYECTAMOS EL CÓDIGO POR PYTHON EXCLUSIVAMENTE EN EL MAESTRO DE INSTANCIAS (COMPATIBLE 32/64)!
      - name: Surgical Silicon Modification (Anti-Overflow & 32-bit GameNative Fix)
        run: |
          echo "-> Ejecutando parche de aislamiento de arquitectura con Python..."
          python3 -c "
          import os
          target = 'src/vulkan/runtime/vk_instance.c'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n')
              headers = '\nextern int mallopt(int param, int value);\nextern int setenv(const char *name, const char *value, int overwrite);\n'
              content = headers + content
              patch = 'extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv(\"MESA_VK_WSI_PRESENT_MODE\", \"mailbox\", 1); setenv(\"vblank_mode\", \"0\", 1); if(sizeof(void*) == 4) { setenv(\"MESA_VK_WSI_QUEUE_SIZE\", \"1\", 1); } vk_icdGetInstanceProcAddr'
              content = content.replace('vk_icdGetInstanceProcAddr', patch, 1)
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
          else:
              device_file = 'src/vulkan/wrapper/wrapper_device.c'
              if os.path.exists(device_file):
                  with open(device_file, 'r', encoding='utf-8') as f:
                      content = f.read()
                  content = content.replace('\r\n', '\n')
                  patch = 'extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv(\"MESA_VK_WSI_PRESENT_MODE\", \"mailbox\", 1); setenv(\"vblank_mode\", \"0\", 1); if(sizeof(void*) == 4) { setenv(\"MESA_VK_WSI_QUEUE_SIZE\", \"1\", 1); } vk_icdGetInstanceProcAddr'
                  content = '\nextern int mallopt(int p, int v);\nextern int setenv(const char *n, const char *v, int o);\n' + content.replace('vk_icdGetInstanceProcAddr', patch, 1)
                  with open(device_file, 'w', encoding='utf-8') as f:
                      f.write(content)
          "

      # INTERCEPTOR DE COMANDOS PARA NINJA
      - name: Create Ninja Wrapper Hijacker (Bypass Unknown Target)
        run: |
          mkdir -p bin_hijack
          cat << 'EOF' > bin_hijack/ninja
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
            if [ "$arg" == "src/vulkan/wrapper/libvulkan_wrapper.so" ] || [ "$arg" == "src/vulkan/runtime/libvulkan_wrapper.so" ]; then
              NEW_ARGS+=("vulkan_wrapper")
            else
              NEW_ARGS+=("$arg")
            fi
          done
          exec /usr/local/bin/ninja "${NEW_ARGS[@]}"
          EOF
          chmod +x bin_hijack/ninja

      # TU COMANDO DE DOCKER ORIGINAL NATIVO INTACTO CON LA RED DESACTIVADA SEGURO
      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm \
            --network none \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # ESTE PASO CREA LA ESTRUCTURA NATIVA EXIGIDA POR BANNERLATOR CON EL NOMBRE ORIGINAL
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo el driver compilado a usr/lib..."
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          fi
          
          echo "-> Inyectando manifiesto JSON ICD oficial original en usr/share/vulkan/icd.d..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura en formato atomico wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
