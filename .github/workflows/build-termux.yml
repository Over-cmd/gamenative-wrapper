name: Compilacion Termux Oficial 

on:
workflow_dispatch:
push:
branches:
- main
- master
- wrapper-25 

jobs:
compilar:
runs-on: ubuntu-latest
steps:
- name: Pipeline Maestro Unificado
run: |
git clone --depth=1 --recursive https://github.com/${{ github.repository }}.git .
git checkout ${{ github.sha }}
sudo apt-get update && sudo apt-get install -y zstd python3
python3 patch_mesa.py
./generate_configs.sh
./generate_dockerfile.sh
CUSTOM_TAG="gamenative-unisoc-builder:latest"
BUILD_DIR_64="b_64"
BUILD_DIR_32="b_32"
export GITHUB_WORKSPACE=$(pwd)
docker build -t "$CUSTOM_TAG" .
docker run --rm -e ARCH=aarch64 -v "$GITHUB_WORKSPACE:/workspace" "
𝐶𝑈𝑆𝑇𝑂𝑀𝑇𝐴𝐺

"

"
BUILD_DIR_64"
docker run --rm -e ARCH=arm -v "$GITHUB_WORKSPACE:/workspace" "
𝐶𝑈𝑆𝑇𝑂𝑀𝑇𝐴𝐺

"

"
BUILD_DIR_32"
mkdir -p unified_out
NDK_PATH=(docker run --rm --entrypoint /bin/bash "CUSTOM_TAG" -c 'find /home/builder/lib -maxdepth 2 -name "android-ndk*" 2>/dev/null | head -n 1')
docker run --rm -v "$GITHUB_WORKSPACE:/workspace" --entrypoint /bin/bash "
𝐶𝑈𝑆𝑇𝑂𝑀𝑇𝐴𝐺

"

−𝑐

"
{NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang -shared -fPIC -O3 /root/bridge.c -o /workspace/unified_out/libvulkan_wrapper.so -ldl"
mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d
if [ -f "$BUILD_DIR_64/libvulkan_wrapper.so" ]; then cp "
𝐵𝑈𝐼𝐿𝐷𝐷𝐼𝑅64

/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟

.

𝑠𝑜

"

𝑝𝑘𝑔

/𝑢𝑠𝑟

/𝑙𝑖𝑏

/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟64

.

𝑠𝑜

;

𝑒𝑙𝑠𝑒𝑐𝑝

"
BUILD_DIR_64/src/vulkan/wrapper/libvulkan_wrapper.so" pkg/usr/lib/libvulkan_wrapper_64.so; fi
if [ -f "$BUILD_DIR_32/libvulkan_wrapper.so" ]; then cp "
𝐵𝑈𝐼𝐿𝐷𝐷𝐼𝑅32

/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟

.

𝑠𝑜

"

𝑝𝑘𝑔

/𝑢𝑠𝑟

/𝑙𝑖𝑏

/𝑙𝑖𝑏𝑣𝑢𝑙𝑘𝑎𝑛𝑤𝑟𝑎𝑝𝑝𝑒𝑟32

.

𝑠𝑜

;

𝑒𝑙𝑠𝑒𝑐𝑝

"
BUILD_DIR_32/src/vulkan/wrapper/libvulkan_wrapper.so" pkg/usr/lib/libvulkan_wrapper_32.so; fi
cp unified_out/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
echo '{"ICD":{"api_version":"1.3.289","library_path":"libvulkan_wrapper.so"},"file_format_version":"1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
cd pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
- name: Publicar Artefacto Multiarch
uses: actions/upload-artifact@v4
with:
name: Bannerlator-Termux-Unisoc-Wrapper
path: wrapper.tzst
