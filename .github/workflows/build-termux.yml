name: Pipetto-Crypto Mesa 25 Vulkan Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mali-driver:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type:
          - release

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      # Parches críticos de fuerza bruta para que la Mali-G52 no sea rechazada por Mesa 25
      - name: Inject Hardware Patches for Mali-G52 (Bifrost v3)
        run: |
          echo "-> Aplicando parches de compatibilidad de API 30 en anon_file.c..."
          TARGET_FILE="src/util/anon_file.c"
          if [ -f "$TARGET_FILE" ]; then
            sed -i 's/fd = syscall(SYS_memfd_create, debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING);/fd = memfd_create(debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING);/g' "$TARGET_FILE"
          fi

          echo "-> HACK 1: Forzando bypass de arquitectura Bifrost v3 en el validador de Mesa..."
          find . -name "pan_device.c" -exec sed -i 's/pan_query_core_count(&dev->kmod.dev->props, &dev->core_id_range);/dev->core_id_range = pan_query_core_count(\&dev->kmod.dev->props);/g' {} + 2>/dev/null || true
          find . -name "pan_device.c" -exec sed -i 's/\\&/\&/g' {} + 2>/dev/null || true
          
          echo "-> HACK 2: Inyectando bypass de conformidad para hardware experimental (Mali-G52 MP2)..."
          find src/panfrost/vulkan/ -name "*.c" -exec sed -i 's/if (!dev->kmod.props.bifrost_v3)/if (false)/g' {} + 2>/dev/null || true
          find src/panfrost/vulkan/ -name "*.c" -exec sed -i 's/if (dev->kmod.props.bifrost_version < 3)/if (false)/g' {} + 2>/dev/null || true
          
          echo "-> HACK 3: Saltando restricciones de formatos del Kernel modificado de Unisoc..."
          find src/panfrost/ -name "*.c" -exec sed -i 's/return pan_kmod_get_format_modifier/return true; \/\/ pan_kmod_get_format_modifier/g' {} + 2>/dev/null || true

          echo "-> HACK 4: Destruyendo el bloqueo de la libreria 'rt' no existente en Android NDK..."
          if [ -f "meson.build" ]; then
            sed -i "s/cc.find_library('rt'/dependency('', required : false) #/g" meson.build
          fi

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Base Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libelf-dev \
            bison \
            flex \
            pkg-config \
            gettext \
            patchelf \
            unzip \
            llvm \
            clang
          python -m pip install --upgrade pip
          pip install mako PyYAML 'meson>=1.4.0' ninja packaging

      - name: Auto-Detect True Android NDK Path
        id: ndk-detector
        run: |
          echo "-> Escaneando el sistema en busca de carpetas NDK validas..."
          TRUE_NDK=""
          for path in /usr/local/lib/android/sdk/ndk/* /home/runner/Android/Sdk/ndk/*; do
            if [ -d "$path/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
              TRUE_NDK="$path"
              break
            fi
          done
          if [ -z "$TRUE_NDK" ]; then
            echo "🚨 ERROR CRITICO: No se encontro ningun NDK real con binarios de 64 bits!" && exit 1
          fi
          echo "-> NDK Real Detectado y validado en: $TRUE_NDK"
          echo "REAL_NDK_HOME=$TRUE_NDK" >> $GITHUB_ENV

      # 🟢 PASO MAESTRO REPARADO: Mapeamos los shims internos del repositorio y disparamos la configuracion cruzada real
      - name: Configure Mesa 25 Cross-Compilation (Meson)
        run: |
          export ANDROID_NDK_HOME="${{ env.REAL_NDK_HOME }}"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          
          # Mapeamos la ruta absoluta del pool de shims de Android que Pipetto empaquetó en la carpeta 'android/'
          if [ -d "$GITHUB_WORKSPACE/android/shims" ]; then
            export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/android/shims:$PKG_CONFIG_PATH"
            export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/android/shims"
          elif [ -d "$GITHUB_WORKSPACE/shims" ]; then
            export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/shims:$PKG_CONFIG_PATH"
            export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/shims"
          fi
          export PKG_CONFIG_SYSROOT_DIR=""
          
          echo "-> Traduciendo variables de entorno en la plantilla de configuracion cruzada..."
          if [ -f "android/android.toml" ]; then
            envsubst < android/android.toml > android-cross-compiled.txt
          elif [ -f "android.toml" ]; then
            envsubst < android.toml > android-cross-compiled.txt
          else
            echo "🚨 ERROR: No se encontró la plantilla android.toml" && exit 1
          fi
          
          echo "-> Inicializando Setup de Mesa 25 de forma cruzada real (ARM64)..."
          meson setup build --reconfigure \
            --cross-file android-cross-compiled.txt \
            -Dbuildtype=${{ matrix.build-type }} \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dvalgrind=disabled \
            -Dzstd=disabled \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=[]

      - name: Compile Mesa 25 Drivers
        run: |
          echo "-> Ejecutando compilación cruzada hacia ARM64 a través de Ninja..."
          meson compile -C build

      - name: Structure and Pack wrapper.tzst for Bannerlator
        run: |
          echo "-> Creando arbol de carpetas estricto para el emulador..."
          rm -rf pkg
          mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          
          echo "-> Buscando el driver real libvulkan_panfrost.so generado..."
          TARGET_SO=$(find build/ -name "libvulkan_panfrost.so" | head -n 1)
          
          if [ -z "$TARGET_SO" ] || [ ! -f "$TARGET_SO" ]; then
            TARGET_SO=$(find . -name "libvulkan_panfrost.so" | head -n 1)
          fi
          
          if [ -n "$TARGET_SO" ] && [ -f "$TARGET_SO" ]; then
            echo "-> 🎯 ¡Driver legítimo PanVK localizado con éxito en $TARGET_SO!"
            cp -v "$TARGET_SO" pkg/usr/lib/libvulkan_panfrost.so
            patchelf --set-soname libvulkan_panfrost.so pkg/usr/lib/libvulkan_panfrost.so 2>/dev/null || true
            llvm-strip --strip-unneeded pkg/usr/lib/libvulkan_panfrost.so 2>/dev/null || true
          else
            echo "🚨 ERROR CRITICO: No se encontró el binario .so esperado en el árbol de carpetas."
            find build/ -name "*.so" || true
            exit 1
          fi

          echo "-> Creando manifiestos ICD JSON oficiales apuntando al driver real..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/panfrost_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_path": "libvulkan_panfrost.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/panfrost_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.4.352",
                  "library_path": "libvulkan_panfrost.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync,nir","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost","vblank_mode":"0","MESA_GLSL_CACHE_DISABLE":"1","MESA_SHADER_CACHE_DISABLE":"true","NIR_DEBUG":"tgsi","MESA_VK_WSI_PRESENT_MODE":"immediate","MESA_VK_WSI_DEBUG":"always_async"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json

          echo "msf:315508" > pkg/version.txt
          
          echo "-> Ajustando permisos y empaquetando..."
          chmod -R 755 pkg/
          chmod 644 pkg/usr/lib/*.so* 2>/dev/null || true
          chmod 644 pkg/usr/share/vulkan/icd.d/*.json 
          chmod 644 pkg/usr/share/vulkan/settings.d/*.json 
          chmod 644 pkg/version.txt

          echo "=== Arbol de Estructura Final del TZST ==="
          ls -R pkg
          echo "=========================================="
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ version.txt
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Pipetto-Mesa25-Mali-Wrapper
          path: wrapper.tzst
