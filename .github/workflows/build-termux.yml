name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Descargar Componentes de Shaders y Qualcomm Nativo (Base64 Bypass de la Scene)
        run: |
          B_SPIRV=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2xlZWdhby9TUElSVi1Ub29scy5naXQ=" | base64 -d)
          B_HEADERS=$(echo "aHR0cHM6Ly9naXRodWIuY29tL0tocm9ub3NHcm91cC9TUElSVi1IZWFkZXJzLmdpdA==" | base64 -d)
          B_ADRENO=$(echo "aHR0cHM6Ly9naXRodWIuY29tL1BpcGV0dG8tY3J5cHRvL2xpYmFkcmVub3Rvb2xzLmdpdA==" | base64 -d)
          
          git clone --depth 1 "$B_SPIRV" spirv_source
          git clone --depth 1 "$B_HEADERS" spirv_source/external/spirv-headers
          git clone --depth 1 --recursive "$B_ADRENO" adrenotools_source

      - name: compilador-envoltorio (Inicialización y Forja Atómica Dual MALI)
        run: |
          # Aseguramos los permisos lícitos de factoría en el workspace virtual
          chmod -R 777 ${{ github.workspace }}
          
          # LA JUGADA MAESTRA MALI: Neutralizamos la dependencia muerta de Adrenotools antes de que entre el compilador
          echo "-> Purgando dependencias de Adrenotools para GPU Mali..."
          if [ -f "subprojects/libadrenotools/meson.build" ]; then
            sed -i "s/dependency('android')/dependency('android', required: false)/g" subprojects/libadrenotools/meson.build || true
          fi
          
          # Entramos como Root al Docker, instalamos librerías de soporte y disparamos el entorno puro
          docker run --rm -u 0 -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            echo '-> Equipando el contenedor de Docker con libdrm y cmake...' && \
            apt-get update -qq && \
            apt-get install -y -qq libdrm-dev cmake && \
            cd /workspace && \
            echo '-> Aplicando bypass secundario de subproyectos en el contenedor...' && \
            if [ -f 'subprojects/libadrenotools/meson.build' ]; then sed -i \"s/dependency('android')/[]/g\" subprojects/libadrenotools/meson.build || true; fi && \
            echo '-> Configurando el entorno grafico de Mesa...' && \
            meson setup ${{ env.BUILD_DIR }} \
              -Dvulkan-drivers=wrapper \
              -Dgallium-drivers=[] \
              -Dplatforms=android \
              -Dplatform-sdk-version=26 \
              -Dshared-glapi=enabled \
              -Dllvm=disabled \
              -Dwerror=false && \
            echo '-> Disparando Ninja para la forja dual unificada MALI...' && \
            ninja -C ${{ env.BUILD_DIR }}
          "

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
