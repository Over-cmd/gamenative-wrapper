name: Compilación de Termux del envoltorio Vulkan de Mesa

on: [push, pull_request]

jobs:
  build-wrapper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [aarch64, armhf] # Compila de forma nativa para 64 y 32 bits

    env:
      BUILD_DIR: compilacion_${{ matrix.arch }}
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Se añade la bandera correspondiente según la arquitectura en la matriz de Docker
      - name: compilador-envoltorio
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }} --arch ${{ matrix.arch }}

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-${{ matrix.arch }}
          path: ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-${{ matrix.arch }}-unstripped
          path: ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
