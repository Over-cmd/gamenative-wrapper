name: Compilación Termux Oficial con nuestro propio Docker Wrapper Unisoc

on:
  push:
    branches: [ "main", "master", "wrapper-25" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilación
  CUSTOM_TAG: gamenative-unisoc-builder:latest

jobs:
  build-driver:
    runs-on: ubuntu-latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Instalar herramientas de compresión
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # ¡INYECTOR HÍBRIDO TOTALMENTE COMPRIMIDO QUE EVITA LOS APAGONES Y CONGELAMIENTOS EN 32 BITS!
      - name: Inyección Quirúrgica Silicio (Modo Fluido y Anti-Cierres)
        run: |
          python3 -c "import os; t='src/vulkan/runtime/vk_instance.c'; f=open(t,'r') if os.path.exists(t) else None; c='\n#include <stdint.h>\nextern int mallopt(int p, int v);\nextern int setenv(const char* n, const char* v, int o);\n'+f.read().replace('vk_icdGetInstanceProcAddr','mallopt(-1002,0);setenv(\"MESA_VK_WSI_PRESENT_MODE\",\"mailbox\",1);setenv(\"vblank_mode\",\"0\",1);if(sizeof(void*)==4){setenv(\"MESA_VK_WSI_QUEUE_SIZE\",\"1\",\"1\");}vk_icdGetInstanceProcAddr',1) if f else ''; f.close() if f else None; f=open(t,'w') if f else None; f.write(c) if f else None; f.close() if f else None"
          python3 -c "import os; t='src/vulkan/wsi/wsi_common.c'; f=open(t,'r') if os.path.exists(t) else None; c=f.read().replace('wsi_device_init(','if(sizeof(void*)==4){setenv(\"MESA_VK_WSI_QUEUE_SIZE\",\"1\",1);setenv(\"vblank_mode\",\"0\",1);} wsi_device_init(',1) if f else ''; f.close() if f else None; f=open(t,'w') if f else None; f.write(c) if f else None; f.close() if f else None"

      # ¡ESTE PASO ASHEMBLEA LOS SCRIPTS Y ARCHIVOS DE CONFIGURACIÓN DE MESON EN LIMPIO EN EL ANFITRIÓN!
      - name: Assemble Offline Compiler Scripts
        run: |
          echo "-> Ensamblando script de construccion y entorno cruzado para Termux..."
          mkdir -p bin_hijack
          
          cat << 'EOF' > bin_hijack/cross_file.txt
          [binaries]
          c = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [constants]
          termux_dir = '/data/data/com.termux/files/usr'

          [properties]
          pkg_config_libdir = termux_dir + '/lib/pkgconfig:' + termux_dir + '/share/pkgconfig'

          [built-in options]
          c_args = ['-D__TERMUX__', '-D__USE_GNU', '-U__ANDROID__', '-I' + termux_dir + '/include', '-include', 'fcntl.h', '-include', 'unistd.h']
          cpp_args = ['-D__TERMUX__', '-D__USE_GNU', '-U__ANDROID__', '-I' + termux_dir + '/include', '-include', 'fcntl.h', '-include', 'unistd.h']
          c_link_args = ['-L' + termux_dir + '/lib', '-landroid-shmem', '-latomic', '-ldl']
          cpp_link_args = ['-L' + termux_dir + '/lib', '-landroid-shmem', '-latomic', '-ldl']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          cat << 'EOF' > bin_hijack/build.sh
          #!/bin/bash
          set -e
          BUILD_DIR="${1:-${BUILD_DIR:-build}}"
          
          echo "-> Autodetectando la ruta absoluta del Android NDK..."
          REAL_NDK=$(find /home/builder/lib -maxdepth 2 -name "android-ndk*" 2>/dev/null | head -n 1)
          sed -i "s|@NDK_PATH@|${REAL_NDK}|g" /root/build-config/cross_file.txt
          
          if [ ! -d "${BUILD_DIR}" ]; then
            meson setup "${BUILD_DIR}" --cross-file /root/build-config/cross_file.txt -Dcpp_rtti=false -Dgbm=disabled -Dopengl=false -Dllvm=disabled -Dshared-llvm=disabled -Dplatforms=x11 -Dgallium-drivers= -Dxmlconfig=disabled -Dandroid-stub=true -Dvulkan-drivers=wrapper
          fi
          ninja -C "${BUILD_DIR}" src/vulkan/wrapper/libvulkan_wrapper.so
          cp "${BUILD_DIR}/src/vulkan/wrapper/libvulkan_wrapper.so" "${BUILD_DIR}/libvulkan_wrapper.so.unstripped"
          
          STRIP="${REAL_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded -o "${BUILD_DIR}/libvulkan_wrapper.so" "${BUILD_DIR}/libvulkan_wrapper.so.unstripped"
          echo "Build successful."
          EOF
          chmod +x bin_hijack/build.sh

      # ¡PASO CORREGIDO CON URL REPARADA Y LOGICA ECHO PARA GENERAR LAS PROPIAS LIBRERIAS BINARIAS .A!
      - name: Generate Local Dockerfile Blueprint
        run: |
          rm -f Dockerfile
          echo "FROM ghcr.io/termux/package-builder:latest" > Dockerfile
          echo "USER root" >> Dockerfile
          echo "RUN apt-get update && apt-get install -y --no-install-recommends ninja-build && pip3 install --break-system-packages --ignore-installed --no-cache-dir meson ninja mako pyyaml packaging" >> Dockerfile
          
          # Repositorio oficial de paquetes CF de Termux restaurado al 100%
          echo "RUN mkdir -p /tmp/sysroot && cd /tmp/sysroot && curl -s 'https://termux.dev' > Packages && PACKAGES='libdrm libandroid-shmem libxcb libx11 libxshmfence libxext libxrandr libxrender xorgproto libxau libxdmcp' && for pkg in \$PACKAGES; do pkg_path=\$(awk -v p=\"Package: \$pkg\" '\$0==p{flag=1} flag && /^Filename:/{print \$2; exit}' Packages) && if [ -n \"\$pkg_path\" ]; then curl -L -O \"https://termux.dev\${pkg_path}\"; fi; done && mkdir -p /data/data/com.termux/files/usr && for f in *.deb; do if [ -f \"\$f\" ]; then dpkg-deb -x \"\$f\" /; fi; done && rm -rf /tmp/sysroot" >> Dockerfile
          
          # TRUCO MAESTRO: Escribimos la cabecera magica de archivo de Linux nativo sin requerir el comando externo 'ar'
          echo "RUN mkdir -p /data/data/com.termux/files/usr/lib && echo '\!<arch>' > /data/data/com.termux/files/usr/lib/libdl.a && echo '\!<arch>' > /data/data/com.termux/files/usr/lib/libatomic.a" >> Dockerfile
          
          echo "RUN mkdir -p /root/build-config" >> Dockerfile
          echo "COPY bin_hijack/cross_file.txt /root/build-config/cross_file.txt" >> Dockerfile
          echo "COPY bin_hijack/build.sh /root/build.sh" >> Dockerfile
          echo "RUN chmod +x /root/build.sh" >> Dockerfile
          echo "WORKDIR /workspace" >> Dockerfile
          echo "ENTRYPOINT [\"/root/build.sh\"]" >> Dockerfile

      - name: Build Custom Unisoc Wrapper Image
        run: |
          docker build -t ${{ env.CUSTOM_TAG }} .

      - name: Execute Custom Unisoc Wrapper Compiler
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ${{ env.CUSTOM_TAG }} ${{ env.BUILD_DIR }}

      - name: Structure and Pack wrapper.tzst
        run: |
          mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": { "api_version": "1.3.289", "library_path": "libvulkan_wrapper.so" },
              "file_format_version": "1.0.0"
          }
          EOF
          cd pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Termux-Unisoc-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
