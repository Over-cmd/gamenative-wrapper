name: Compilación Real de Mesa 24 MALI Anti-Overflow

on:
  workflow_dispatch:

jobs:
  build-mali-mesa:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build_output

    steps:
      - name: Checkout del Repositorio Principal (Mesa 24)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configurar Herramientas de Compilación Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config python3-mako python3-pip zstd tar wget glslang-tools libdrm-dev

      - name: Activar Android NDK Nativo del Servidor (Cero Descargas)
        run: |
          NDK_SERVER_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          if [ -z "$NDK_SERVER_PATH" ]; then
            NDK_SERVER_PATH="/usr/local/lib/android/sdk/ndk-bundle"
          fi
          echo "ANDROID_NDK_LATEST_HOME=$NDK_SERVER_PATH" >> $GITHUB_ENV

      - name: Modificación Quirúrgica del Silicio (Bypass de Errores e Inyección Anti-Leak)
        run: |
          echo "-> Purgando dependencias estrictas de Qualcomm (Adrenotools) para GPU Mali..."
          # Neutralizamos el subproyecto de Adreno para que no pida la librería 'android' que hace colapsar el entorno Linux
          if [ -f "subprojects/libadrenotools/meson.build" ]; then
            sed -i "s/dependency('android')/dependency('android', required: false)/g" subprojects/libadrenotools/meson.build || true
          fi

          echo "-> Saneando los archivos core del Wrapper de Mesa..."
          # Localizamos el archivo de inicialización del dispositivo Vulkan del Wrapper
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # VÁLVULA DE ESCAPE REAL BIONIC: Sembramos mallopt(-1000, 0) justo al inicio de la inicialización gráfica.
            # Esto obliga a tu Unisoc T618 a vaciar radicalmente la RAM en cada llamada de renderizado, eliminando la asfixia de Wizard101.
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;ienvVars.put("MALLOC_TRIM_THRESHOLD_", "65536");\nmallopt(-1000, 0);' "$WRAPPER_DEVICE" 2>/dev/null || \
            sed -i '1iextern int mallopt(int param, int value);' "$WRAPPER_DEVICE"
            
            # Redirección de escape de PRoot para saltar el muro de aislamiento de carpetas
            sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' "$WRAPPER_DEVICE"
            sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' "$WRAPPER_DEVICE"
          fi

          # Parche de seguridad para inclusiones Unix huérfanas en el entorno virtual
          find src/ -name "wrapper_device_memory.c" -exec sed -i '1i#include <fcntl.h>' {} + || true
          find src/ -name "wrapper_physical_device.c" -exec sed -i '1i#include <fcntl.h>' {} + || true

      - name: Configurar e Inicializar Entorno Gráfico (Meson Setup)
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          SYSROOT_PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          # Creamos el mapa de construcción de Mesa apuntando al enlazado dinámico permisivo para silenciar undefined symbols
          meson setup ${{ env.BUILD_DIR }} \
            --cross-file android.toml \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers=[] \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dshared-glapi=enabled \
            -Dllvm=disabled \
            -Dwerror=false \
            -Dc_link_args="-Wl,--allow-shlib-undefined" \
            -Dcpp_link_args="-Wl,--allow-shlib-undefined"

      - name: Disparar la Forja Principal (Ninja Build)
        run: |
          # Ninja toma el control del taller y tritura el árbol completo de Mesa 24 de forma atómica
          ninja -C ${{ env.BUILD_DIR }} -j $(nproc)

      - name: Despojar y Estructurar el Fat Binary Unificado Final
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          mkdir -p wrapper_final/usr/lib
          mkdir -p wrapper_final/usr/share/vulkan/icd.d
          
          # Buscamos el archivo .so recién horneado por Ninja
          COMPILED_SO=$(find ${{ env.BUILD_DIR }} -name "libvulkan_wrapper.so" | head -n 1)
          cp -f "$COMPILED_SO" wrapper_final/usr/lib/libvulkan_wrapper.so
          
          # Eliminamos tablas de depuración innecesarias para aliviar el rendimiento en Android
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all wrapper_final/usr/lib/libvulkan_wrapper.so
          
          # Generamos el manifiesto ICD JSON oficial de Khronos
          printf '{\n    "file_format_version": "1.0.0",\n    "ICD": {\n        "library_path": "libvulkan_wrapper.so",\n        "api_version": "1.1.0"\n    }\n}\n' > wrapper_final/usr/share/vulkan/icd.d/icd_wrapper.json
          
          # Empaquetamos todo en formato estándar capturable
          tar -cf wrapper.tar -C wrapper_final usr
          zstd -19 --rm wrapper.tar -o wrapper.tzst

      - name: Subir Driver Mesa MALI Definitivo a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vulkan-mali-mesa24
          path: wrapper.tzst
          compression-level: 0
