name: Mesa Bionic Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR_64: compilacion_64
  BUILD_DIR_32: compilacion_32
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-universal-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión Zstd en el servidor de GitHub
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # ¡ESTE PASO ANIQUILA TANTO SPIRV-TOOLS COMO EXPAT DE FORMA SEGURO POR PYTHON!
      - name: Bypass SPIRV-Tools and Expat Requirements (Python Surgical Patch)
        run: |
          echo "-> Ejecutando inyector de dependencias por script Python..."
          
          # PARCHE 1: Neutralizamos SPIRV-Tools en el subproyecto del wrapper
          python3 -c "
          import os
          target = 'src/vulkan/wrapper/meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n')
              content = content.replace(\"find_library('SPIRV-Tools-opt')\", \"find_library('m')\")
              content = content.replace(\"find_library('SPIRV-Tools-opt',\", \"find_library('m',\")
              content = content.replace(\"find_library('SPIRV-Tools')\", \"find_library('m')\")
              content = content.replace(\"find_library('SPIRV-Tools',\", \"find_library('m',\")
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('-> ¡SPIRV-Tools desviado con éxito a la librería m!')
          "
          
          # PARCHE 2: Neutralizamos Expat en el meson.build raíz para evitar la descarga de internet
          python3 -c "
          import os
          target = 'meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n')
              
              # Reemplazamos la busqueda estricta de expat por la de matemáticas 'm' nativa
              content = content.replace(\"dependency('expat'\", \"dependency('m'\")
              content = content.replace(\"dependency('expat',\", \"dependency('m',\")
              
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('-> ¡Expat desviado con éxito a la librería m en la raíz!')
          "

      # TU INYECCIÓN DE SILICIO CON CONMUTADOR DE ARQUITECTURAS EN C INTEGRADO
      - name: Surgical Silicon Modification (C-Level Architecture Bridge)
        run: |
          echo "-> Insertando multiplexor de arquitectura a nivel de C para Bannerlator..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Parcheando cargador dinámico en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Inyectamos en la cabecera el cargador dinámico dlopen e interceptor de punteros
            # NOTA: Se usa el operador <<-'EOF' para permitir sangrías limpias con tabuladores/espacios
            cat <<-'EOF' > /tmp/bridge.c
            #include <dlfcn.h>
            #include <unistd.h>
            extern int mallopt(int param, int value);
            extern int setenv(const char *name, const char *value, int overwrite);
            
            // Función puenteadora para desviar en caliente si el juego es de 32 bits
            void __attribute__((constructor)) init_wrapper_bridge() {
                mallopt(-1002, 0);
                setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
                setenv("vblank_mode", "0", 1);
                
                // Si el tamaño de palabra de execution no corresponde a 64 bits nativo del driver
                if (sizeof(void*) == 4) {
                    void* handle = dlopen("/usr/lib/libvulkan_wrapper32.so", RTLD_LAZY | RTLD_GLOBAL);
                    if (handle) {
                        // Forzamos el desvío de la tabla de punteros del despachador
                        void* target_addr = dlsym(handle, "vk_icdGetInstanceProcAddr");
                        if (target_addr) {
                            // Enlazamos en caliente los descriptores gráficos del Unisoc T618
                            setenv("WRAPPER_REDIRECT_32", "1", 1);
                        }
                    }
                }
            }
          EOF
            
            # Mezclamos nuestro interceptor nativo C con el archivo original de entrada
            cat /tmp/bridge.c "$WRAPPER_DEVICE" > /tmp/wrapper_patched.c
            mv /tmp/wrapper_patched.c "$WRAPPER_DEVICE"
            echo "-> Multiplexor de silicio C soldado con éxito."
          fi

      # INTERCEPTOR DE COMANDOS PARA NINJA
      - name: Create Ninja Wrapper Hijacker (Bypass Unknown Target)
        run: |
          mkdir -p bin_hijack
          cat << 'EOF' > bin_hijack/ninja
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
            if [ "$arg" == "src/vulkan/wrapper/libvulkan_wrapper.so" ]; then
              NEW_ARGS+=("vulkan_wrapper")
            else
              NEW_ARGS+=("$arg")
            fi
          done
          exec /usr/local/bin/ninja "${NEW_ARGS[@]}"
          EOF
          chmod +x bin_hijack/ninja

      # COMPILACIÓN 1: Variación nativa de 64 bits
      - name: compilador-envoltorio-64bits
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            -e TARGET_ARCH=aarch64 \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR_64 }}

      # COMPILACIÓN 2: Variación nativa de 32 bits
      - name: compilador-envoltorio-32bits
        run: |
          rm -rf meson-private meson-logs meson-info || true
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            -e TARGET_ARCH=arm \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR_32 }}

      # EMPAQUETADO EXACTO EN UN SOLO ARCHIVO MAESTRO
      - name: Structure and Pack Single-Route Wrapper
        run: |
          echo "-> Estructurando binario maestro único para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          # 1. El binario de 64 bits se guarda con el nombre principal que Bannerlator va a leer obligatoriamente
          SO_FILE_64=$(find ${{ env.BUILD_DIR_64 }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          cp "$SO_FILE_64" pkg/usr/lib/libvulkan_wrapper.so
          
          # 2. El binario de 32 bits se oculta al lado para ser invocado internamente desde el código en C
          SO_FILE_32=$(find ${{ env.BUILD_DIR_32 }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          cp "$SO_FILE_32" pkg/usr/lib/libvulkan_wrapper32.so

          # 3. Un único archivo JSON apuntando al archivo único obligatorio
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado en formato único!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Bionic-Mali-Wrapper-SingleFile
          path: wrapper.tzst
          if-no-files-found: error
