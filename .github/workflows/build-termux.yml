name: Compilación de Termux del envoltorio Vulkan de Mesa

on: [push, pull_request]

jobs:
  build-wrapper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [aarch64, armhf]

    env:
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Corregimos el comando Docker pasando variables de entorno según la arquitectura
      - name: compilador-envoltorio
        run: |
          mkdir -p build_${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "armhf" ]; then
            # Para 32 bits, inyectamos variables de compilación cruzada comunes en contenedores de Android/Termux
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              -e CFLAGS="-m32 -march=armv7-a" \
              -e CXXFLAGS="-m32 -march=armv7-a" \
              -e LDFLAGS="-m32" \
              -e TARGET_ARCH="arm" \
              ${{ env.IMAGE_TAG }} build_armhf
          else
            # Para 64 bits por defecto
            docker run --rm \
              -v "${{ github.workspace }}:/workspace" \
              ${{ env.IMAGE_TAG }} build_aarch64
          fi

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-${{ matrix.arch }}
          path: build_${{ matrix.arch }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-${{ matrix.arch }}-unstripped
          path: build_${{ matrix.arch }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
