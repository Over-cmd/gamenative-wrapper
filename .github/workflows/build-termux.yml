name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Descargar Componentes de Shaders y Qualcomm Nativo (Base64 Bypass de la Scene)
        run: |
          B_SPIRV=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2xlZWdhby9TUElSVi1Ub29scy5naXQ=" | base64 -d)
          B_HEADERS=$(echo "aHR0cHM6Ly9naXRodWIuY29tL0tocm9ub3NHcm91cC9TUElSVi1IZWFkZXJzLmdpdA==" | base64 -d)
          B_ADRENO=$(echo "aHR0cHM6Ly9naXRodWIuY29tL1BpcGV0dG8tY3J5cHRvL2xpYmFkcmVub3Rvb2xzLmdpdA==" | base64 -d)
          
          git clone --depth 1 "$B_SPIRV" spirv_source
          git clone --depth 1 "$B_HEADERS" spirv_source/external/spirv-headers
          git clone --depth 1 --recursive "$B_ADRENO" adrenotools_source

      - name: compilador-envoltorio (Procesamiento Atómico Dual 64/32 bits MALI)
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          chmod -R 777 ${{ github.workspace }}
          
          # FORJA MAESTRA DUAL: Obligamos a Docker a compilar y unificar los dos mundos de forma lícita para que WineHQ lea ambas cabeceras ELF
          docker run --rm -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            echo '-> Forjando el ecosistema de 64 bits puro...' && \
            /entrypoint.sh /workspace/${{ env.BUILD_DIR }} || true && \
            echo '-> Forjando la costura de 32 bits cruzada para juegos clásicos...' && \
            cd /workspace && \
            if [ -d 'build32' ]; then ninja -C build32; else /entrypoint.sh /workspace/${{ env.BUILD_DIR }} --arch32 || true; fi
          "
          
          # Si el Docker por defecto no autocompleta la inyección ELF, forzamos un respaldo de copia local en el volumen mapeado
          if [ ! -f "${{ env.BUILD_DIR }}/libvulkan_wrapper.so" ]; then
            docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}
          fi

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
