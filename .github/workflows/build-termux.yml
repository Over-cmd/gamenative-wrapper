name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión Zstd en el servidor de GitHub
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # PARCHE EXTRA: Rompe la rigidez estructural de Over-cmd para salvar la carga en juegos de 32 bits
      - name: Fix Over-cmd Meson Rigidity (Anti-Crash 32bit Load)
        run: |
          echo "-> Analizando scripts de construcción de Mesa para inyectar compatibilidad inline..."
          python3 -c "
          import os
          target = 'src/vulkan/wrapper/meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              # Modificamos los argumentos de C en el build para forzar la compatibilidad cruzada de Box86
              if 'c_args' in content:
                  content = content.replace(\"c_args : [\", \"c_args : ['-D__inline__=', \")
                  with open(target, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('-> ¡Alineación de emulación inline inyectada en Meson correctamente!')
          "

      # REESCRITURA QUIRÚRGICA EN C: Interceptamos las extensiones usando Tipos Oficiales de Vulkan
      - name: Surgical Silicon Modification (Anti-Overflow MALI Hybrid 32/64 Injection)
        run: |
          echo "-> Insertando desvío de extensiones Vulkan con tipado estricto para Clang..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Usamos un truco de preprocesador en la primera línea. Redirigimos la función interna original de Mesa
            # sin alterar las declaraciones previas de las cabeceras vk_icd.h
            sed -i '1i#define vk_icdGetInstanceProcAddr original_vk_icdGetInstanceProcAddr' "$WRAPPER_DEVICE"
            
            # Agregamos al final del archivo el interceptor utilizando la firma exacta que exige vk_icd.h
            cat <<-'EOF' >> "$WRAPPER_DEVICE"
            
            #undef vk_icdGetInstanceProcAddr
            #include <vulkan/vulkan.h>
            #include <vulkan/vk_icd.h>
            #include <string.h>
            
            extern int mallopt(int param, int value);
            extern int setenv(const char *name, const char *value, int overwrite);
            extern PFN_vkVoidFunction VKAPI_CALL original_vk_icdGetInstanceProcAddr(VkInstance instance, const char* pName);
            
            // Interceptor maestro universal con tipado oficial de Vulkan para la GPU Mali
            VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL vk_icdGetInstanceProcAddr(VkInstance instance, const char* pName) {
                mallopt(-1002, 0);
                setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
                setenv("vblank_mode", "0", 1);
                
                // Si estamos en ejecución de 32 bits emulada por Box86:
                if (sizeof(void*) == 4) {
                    setenv("MESA_VK_WSI_QUEUE_SIZE", "1", 1);
                    setenv("BOX86_EMULATED_LIBS", "libvulkan_wrapper.so", 1);
                    setenv("BOX86_MMAP32", "1", 1);
                    
                    // Capamos de forma segura las extensiones KHR estrictas de 64 bits que rompen Over-cmd
                    if (pName && (strcmp(pName, "vkGetPhysicalDeviceProperties2KHR") == 0 || 
                                  strcmp(pName, "vkGetPhysicalDeviceFeatures2KHR") == 0 ||
                                  strcmp(pName, "vkRegisterDeviceCustomCallbacksEXT") == 0)) {
                        return (PFN_vkVoidFunction)NULL;
                    }
                }
                
                return original_vk_icdGetInstanceProcAddr(instance, pName);
            }
          EOF
            echo "-> ¡Filtro estricto de la API de Vulkan inyectado con éxito!"
          else
            echo "-> Archivo wrapper_device.c no encontrado, aplicando fallback..."
            find src/ -name "*.c" -exec sed -i 's/vk_icdGetInstanceProcAddr/extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1); setenv("vblank_mode", "0", 1); if (sizeof(void*) == 4) { setenv("MESA_VK_WSI_QUEUE_SIZE", "1", 1); } vk_icdGetInstanceProcAddr/g' {} + || true
          fi

      # COMPILACIÓN ORIGINAL DEL DOCKER NATIVO INTACTA
      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # ¡ESTE PASO CREA LOS MANIFIESTOS DUALES EXIGIDOS POR BOX86 Y BOX64 PARA BANNERLATOR!
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo el driver compilado a usr/lib..."
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura dual en formato wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
