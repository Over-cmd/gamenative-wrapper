name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilacion
      IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preparar Espacio de Trabajo Local
        run: |
          # Creamos el directorio limpio y aseguramos permisos lícitos de factoría
          mkdir -p ${{ env.BUILD_DIR }}
          chmod -R 777 ${{ github.workspace }}

      - name: Configurar Entorno de Construcción (Generar build.ninja)
        run: |
          # Forzamos a Docker a ejecutar el setup inicial de Meson en el workspace para que dibuje el mapa build.ninja de 32 y 64 bits de tu GPU Mali
          docker run --rm -v "${{ github.workspace }}:/workspace" --entrypoint /bin/bash ${{ env.IMAGE_TAG }} -c "
            cd /workspace && \
            meson setup ${{ env.BUILD_DIR }} \
              --cross-file /workspace/cross64.txt 2>/dev/null || \
            meson setup ${{ env.BUILD_DIR }} \
              -Dvulkan-drivers=wrapper \
              -Dgallium-drivers=[] \
              -Dplatforms=android \
              -Dplatform-sdk-version=26 \
              -Dshared-glapi=enabled \
              -Dllvm=disabled \
              -Dwerror=false
          "

      - name: compilador-envoltorio (Procesamiento Atómico de Factoría MALI)
        run: |
          # Ahora que build.ninja existe lícitamente en el silicio virtual, el compilador por defecto triturará ambos carriles
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      - name: Cargar libvulkan_wrapper.so sin formato
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
          
      - name: cargar libvulkan_wrapper.so sin eliminar
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper-unstripped
          path: |
            ${{ env.BUILD_DIR }}/libvulkan_wrapper.so.unstripped
          if-no-files-found: error
