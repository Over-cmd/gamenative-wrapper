name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          # Coordenada rígida del binario real de 19MB con adrenotools y bypass Mali
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
              size_bytes=$(stat -c%s "$WRAPPER_SO")
              size_mb=$(echo "scale=2; $size_bytes/1024/1024" | bc 2>/dev/null || echo "19.00")
              echo "-> [Host] ¡Éxito! Driver wrapper original localizado. Peso: $size_mb MB"
              
              # 1. Creación limpia paso a paso del árbol rígido en el Host
              rm -rf final_pkg
              mkdir -p final_pkg/usr/lib
              mkdir -p final_pkg/usr/share/vulkan/icd.d
              
              # 2. INYECCIÓN DEL BINARIO ORIGINAL
              echo "-> Guardando binario como libvulkan_wrapper.so..."
              cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
              
              # 3. 🟢 INYECCIÓN COORDENADA DE TODO EL KIT ADRENOTOOLS DEL ESCÁNER
              echo "-> Inyectando componentes moleculares de adrenotools..."
              find build/subprojects/libadrenotools/ -name "*.so" -exec cp -fv {} final_pkg/usr/lib/ \; 2>/dev/null || true
              
              # Intentar jalar la librería de soporte libdrm
              find ${{ env.BUILD_DIR }} -name "libdrm.so" -type f -size +10k -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # Forzamos permisos de ejecución rígidos 755 grabados de fábrica para Bannerlator
              chmod -R -v 755 final_pkg/usr/lib/
              
              # 4. CONSOLIDACIÓN DE IDENTIDAD INMUTABLE (patchelf)
              patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' final_pkg/usr/lib/libvulkan_wrapper.so || true
              
              # Alinear rpath de las sublibrerías de adrenotools para que se muerdan entre sí en la misma carpeta
              find final_pkg/usr/lib/ -name "*.so" ! -name "libvulkan_wrapper.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
              
              # 5. INYECCIÓN DE MANIFIESTOS CON RUTA ABSOLUTA RÍGIDA
              echo "-> Inyectando manifiestos ICD oficiales para Box86/Box64..."
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Forzamos el asentamiento físico inmediato en las celdas del disco virtual
              sync && sleep 3
              
              # Escáner preventivo en el log para verificar la integridad antes de empaquetar
              echo "-> Estructura física final unificada en el paquete definitivo:"
              find final_pkg/ -type f -exec ls -lh {} \;
              
              # 6. TU RECETA DE COMPRESIÓN GANADORA NATIVO SÍNCRONA
              echo "-> Forjando el archivo comprimido definitivo wrapper.tzst..."
              cd final_pkg
              tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
              cd ..
              echo "-> ¡Empaquetado unificado completado con éxito!"
          else
              echo "-> [❌ ERROR GRAVE] El binario del wrapper original de 19MB no existe en la ruta esperada."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
