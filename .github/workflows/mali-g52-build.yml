name: GameNative Vulkan Wrapper Build

on:
  push:
    branches: [ wrapper-25 ]
  pull_request:
    branches: [ wrapper-25 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gamenative-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core Source
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Android libdrm Source
        uses: actions/checkout@v4
        with:
          repository: waydroid/android_external_libdrm
          ref: lineage-18.1
          path: main-repo/subprojects/libdrm

      - name: Checkout libadrenotools Source
        uses: actions/checkout@v4
        with:
          repository: Pipetto-crypto/libadrenotools
          ref: master
          path: main-repo/subprojects/libadrenotools

      - name: Execute External Indestructible Build Script
        run: |
          cd main-repo
          chmod +x build.sh
          ./build.sh

            - name: Upload Final wrapper.tzst Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-Mali-G52-Wrapper
          path: wrapper.tzst # Lee de forma directa el archivo exportado en la raíz global
