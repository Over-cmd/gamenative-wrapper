name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          # 🟢 COORDENADA RÍGIDA DIRECTA: Capturamos el binario real recortado y purificado por el script
          WRAPPER_SO="gamenative_driver_rootfs.tar.zst"
          
          # Buscador elástico en build si el script lo dejó suelto en otra celda
          if [ ! -f "$WRAPPER_SO" ]; then
              WRAPPER_SO=$(find . -name "gamenative_driver_rootfs.tar.zst" -o -name "libvulkan_wrapper.so" | head -n 1)
          fi
          
          echo "-> [Host] Extrayendo y estructurando paquete legítimo definitivo..."
          
          # 1. Creación limpia paso a paso del árbol rígido en la raíz de trabajo
          rm -rf final_pkg
          mkdir -p final_pkg/usr/lib
          mkdir -p final_pkg/usr/share/vulkan/icd.d
          
          # 2. Localizamos el binario interno real de 9.09 MiB (18.6 MB original sin depurar)
          INTERNAL_SO=$(find ${{ env.BUILD_DIR }} -name "libvulkan_wrapper.so" -type f -size +5M | head -n 1)
          if [ ! -f "$INTERNAL_SO" ]; then
              INTERNAL_SO=$(find . -name "libvulkan_wrapper.so" -type f -size +5M | head -n 1)
          fi
          
          if [ -f "$INTERNAL_SO" ]; then
              echo "-> [Host] ¡Éxito! Inyectando binario del wrapper unificado: $INTERNAL_SO"
              cp -fv "$INTERNAL_SO" final_pkg/usr/lib/libvulkan_wrapper.so
              
              # Intentar jalar la librería de soporte libdrm
              find ${{ env.BUILD_DIR }} -name "libdrm.so" -type f -size +10k -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # Forzamos permisos de ejecución rígidos 755 grabados de fábrica para Bannerlator
              chmod -v 755 final_pkg/usr/lib/libvulkan_wrapper.so
              if [ -f "final_pkg/usr/lib/libdrm.so" ]; then chmod -v 755 final_pkg/usr/lib/libdrm.so; fi
              
              # Consolidación de identidad interna con patchelf
              patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' final_pkg/usr/lib/libvulkan_wrapper.so || true
              
              # 3. Inyección de manifiestos JSON ICD duales en líneas planas con ruta absoluta rígida
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Forzamos el asentamiento físico inmediato en las celdas del disco virtual
              sync && sleep 3
              
              # Escáner preventivo en el log para verificar la integridad del rootfs
              echo "-> Estructura física final en el Host antes del empaquetado definitivo:"
              find final_pkg/ -type f -exec ls -lh {} \;
              
              # 4. TU RECETA DE COMPRESIÓN GANADORA SÍNCRONA COMPLETA
              echo "-> Forjando el archivo comprimido definitivo wrapper.tzst..."
              cd final_pkg
              tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
              cd ..
              echo "-> ¡Empaquetado unificado completado con éxito!"
          else
              echo "-> [❌ ERROR GRAVE] No se localizó el binario libvulkan_wrapper.so en ninguna celda del Host."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
