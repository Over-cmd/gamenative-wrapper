name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code (Rama Activa wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zip zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          REAL_SO=$(find ${{ env.BUILD_DIR }} -name "libvulkan_wrapper.so" | head -n 1)
          
          if [ -f "$REAL_SO" ]; then
              size_mb=$(os_size=$(stat -c%s "$REAL_SO"); echo "scale=2; $os_size/1024/1024" | bc 2>/dev/null || echo "9.3")
              echo "-> [Host] ¡Éxito Absoluto! Driver real localizado. Peso real: $size_mb MB"
              
              # 1. Limpieza y creación del árbol de directorios rígido
              rm -rf pkg_export
              mkdir -p pkg_export/usr/lib
              mkdir -p pkg_export/usr/share/vulkan/icd.d
              
              # 2. Inyectar tu driver de 9.2 MB reales
              cp -fv "$REAL_SO" pkg_export/usr/lib/libvulkan_wrapper.so
              
              # 3. Rescatar libdrm.so de forma complementaria si existe
              find ${{ env.BUILD_DIR }} -name "libdrm.so" -type f -size +10k -exec cp -fv {} pkg_export/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # 4. Modificar el binario con patchelf
              patchelf --set-soname libvulkan_wrapper.so pkg_export/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' pkg_export/usr/lib/libvulkan_wrapper.so || true
              
              # 5. Escritura plana del manifiesto ICD Vulkan
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg_export/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              
              # Aseguramos el asentamiento en el disco
              sync && sleep 2
              
              # 🟢 EL CAMBIO CLAVE MUNDIAL: Cambiamos tar por ZIP. Entramos a pkg_export/ 
              # y empaquetamos de forma recursiva la carpeta usr/ completa en un archivo wrapper.zip 
              # que Android decodifica de forma nativa sin perder subcarpetas con puntos.
              echo "-> Forjando el archivo comprimido definitivo wrapper.zip..."
              cd pkg_export
              zip -r ../wrapper.zip usr
              cd ..
              
              echo "=========================================================="
              echo " 🟢 MAQUETACIÓN COMPLETADA - ARCHIVO WRAPPER.ZIP LISTO OK  "
              echo "=========================================================="
          else
              echo "-> [❌ ERROR GRAVE] El compilador local falló en escribir el binario."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.zip
          retention-days: 7
