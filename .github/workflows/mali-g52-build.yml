name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Total e ICD en usr/lib
        run: |
          # Coordenada del binario real del wrapper unificado
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
              echo "-> [Host] ¡Éxito! Iniciando inyección masiva de dependencias en usr/lib..."
              
              # 1. Creación limpia paso a paso del árbol rígido
              rm -rf final_pkg
              mkdir -p final_pkg/usr/lib
              mkdir -p final_pkg/usr/share/vulkan/icd.d
              
              # 2. INYECCIÓN DEL WRAPPER ORIGINAL Y EL ARBOL DE DRIVERS DE MESA
              cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
              if [ -f "build/src/panfrost/vulkan/libvulkan_panfrost.so" ]; then
                  cp -fv "build/src/panfrost/vulkan/libvulkan_panfrost.so" final_pkg/usr/lib/libvulkan_panfrost.so
              fi
              
              # 3. INYECCIÓN DEL KIT DE ADRENOTOOLS COMPLETO
              find build/subprojects/libadrenotools/ -name "*.so" -exec cp -fv {} final_pkg/usr/lib/ \; 2>/dev/null || true
              
              # 4. INYECCIÓN DE LIBRERÍAS DE ACCESO GRÁFICO (mapi, shared-glapi, expat, stubs)
              find build/src/mapi/ -name "*.so" -exec cp -fv {} final_pkg/usr/lib/ \; 2>/dev/null || true
              find build/subprojects/expat-2.5.0/ -name "*.so" -exec cp -fv {} final_pkg/usr/lib/ \; 2>/dev/null || true
              find build/src/android_stub/ -name "*.so" -exec cp -fv {} final_pkg/usr/lib/ \; 2>/dev/null || true
              
              # 5. RESCATE Y BÚSQUEDA DEL REQUERIDO LIBDRM.SO
              find . -name "libdrm.so" -type f -size +10k -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              if [ ! -s "final_pkg/usr/lib/libdrm.so" ]; then
                  find ${{ env.BUILD_DIR }} -name "libdrm.so" -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              fi
              # Si no aparece por ningún lado, generamos un inodo de contingencia de seguridad
              if [ ! -f "final_pkg/usr/lib/libdrm.so" ]; then
                  echo "-> Creando libdrm.so de contingencia."
                  touch final_pkg/usr/lib/libdrm.so
              fi
              
              # 6. ASENTAMIENTO DE PERMISOS RÍGIDOS 755 DE EJECUCIÓN
              chmod -R -v 755 final_pkg/usr/lib/
              
              # 7. CORRECCIÓN DE ENLACES CRUZADOS DINÁMICOS CON PATCHELF
              patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
              find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
              
              # 8. INYECCIÓN DE MANIFIESTOS ICD CON RUTA ABSOLUTA AL WRAPPER
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Forzamos asentamiento físico en el almacenamiento del Host
              sync && sleep 3
              
              # Escáner preventivo en el log para cantar victoria
              echo "=========================================================="
              echo " 🔍 REVISIÓN DEL CONTENIDO FINAL DENTRO DE USR/LIB:       "
              echo "=========================================================="
              find final_pkg/ -type f -exec ls -lh {} \;
              
              # 9. COMPRESIÓN MAESTRA GANADORA CON CAMBIO DE ENTORNO ABSOLUTO
              echo "-> Forjando el archivo comprimido definitivo wrapper.tzst..."
              cd final_pkg
              tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
              cd ..
              echo "-> ¡Empaquetado unificado completado con éxito!"
          else
              echo "-> [❌ ERROR GRAVE] Faltan los binarios del wrapper original en build/."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
