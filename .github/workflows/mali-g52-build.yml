name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          # Coordenada rígida del binario real de 19MB con adrenotools
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
              size_bytes=$(stat -c%s "$WRAPPER_SO")
              size_mb=$(echo "scale=2; $size_bytes/1024/1024" | bc 2>/dev/null || echo "19.00")
              echo "-> [Host] ¡Éxito! Wrapper original localizado. Peso: $size_mb MB"
              
              # 1. Creación limpia paso a paso del árbol rígido en el Host
              rm -rf pkg
              mkdir -p pkg/usr/lib
              mkdir -p pkg/usr/share/vulkan/icd.d
              
              # 2. Inyección del binario manteniendo el nombre estricto del wrapper
              echo "-> Guardando binario como libvulkan_wrapper.so..."
              cp -fv "$WRAPPER_SO" pkg/usr/lib/libvulkan_wrapper.so
              
              # Intentar jalar la librería de soporte libdrm si existiera
              find ${{ env.BUILD_DIR }} -name "libdrm.so" -type f -size +10k -exec cp -fv {} pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # 🟢 EL AJUSTE SOLICITADO: Forzamos de forma explícita los permisos de lectura y ejecución en el árbol
              echo "-> Aplicando permisos de ejecución binaria rígidos (chmod 755)..."
              chmod -v 755 pkg/usr/lib/libvulkan_wrapper.so
              if [ -f "pkg/usr/lib/libdrm.so" ]; then chmod -v 755 pkg/usr/lib/libdrm.so; fi
              
              # Sellar identidades binarias y dependencias internas con patchelf
              patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' pkg/usr/lib/libvulkan_wrapper.so || true
              
              # 3. Inyección de manifiestos con ruta relativa plana sin barras diagonales
              echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              
              echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Forzamos el asentamiento físico inmediato en las celdas del disco virtual
              sync && sleep 3
              
              # Escáner preventivo en el log para verificar la integridad antes de empaquetar
              echo "-> Estructura física final unificada en el Host:"
              find pkg/ -type f -exec ls -lh {} \;
              
              # 4. EMPAQUETADO INDUSTRIAL SEGURO
              echo "-> Forjando el archivo comprimido definitivo wrapper.tzst..."
              tar -C pkg -I 'zstd -19 -T0' -cf wrapper.tzst usr
              echo "-> ¡Empaquetado unificado completado con éxito!"
          else
              echo "-> [❌ ERROR GRAVE] El binario del wrapper original de 19MB no existe en la ruta esperada."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
