name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: 🛠️ 3. Purificar Cabeceras, Silenciar libsync.h y Enlazar Stubs en Gallium (v115)
        run: |
          echo "=========================================================="
          echo " 🧬 PURIFICANDO CABECERAS Y ENTORNO DE COMPILACIÓN        "
          echo "=========================================================="
          # 1. Parche estándar de inodo de logs temporales universales
          TARGET_C="src/vulkan/wrapper/wrapper_device.c"
          if [ -f "$TARGET_C" ]; then
              sed -i 's|/data/data/app.gamenative/files/imagefs/usr/tmp/|/tmp/|g' "$TARGET_C"
              echo "-> Parche de inodo temporal aplicado."
          fi
          
          # 2. Vaciamos el archivo vk_android.c parásito de Mesa para evitar redefiniciones
          ANDROID_MESA_C="src/vulkan/runtime/vk_android.c"
          if [ -f "$ANDROID_MESA_C" ]; then
              echo "/* Vaciado por el Workflow para evitar redefiniciones con adrenotools */" > "$ANDROID_MESA_C"
              echo "-> vk_android.c neutralizado."
          fi
          
          # 3. Inyectamos #include <string.h> en la cabecera de panvk_android.c
          PANVK_ANDROID_C="src/panfrost/vulkan/panvk_android.c"
          if [ -f "$PANVK_ANDROID_C" ]; then
              sed -i '1i #include <string.h>' "$PANVK_ANDROID_C"
              echo "-> panvk_android.c parchado con éxito."
          fi
          
          # 4. Vaciamos el archivo src/util/libsync.h parásito de Mesa por completo para salvar EGL
          LIBSYNC_H="src/util/libsync.h"
          if [ -f "$LIBSYNC_H" ]; then
              echo "/* Vaciado por el Workflow para usar exclusivamente los stubs de Over-cmd */" > "$LIBSYNC_H"
              echo "-> libsync.h silenciado de forma exitosa."
          fi
          
          # 5. Inyectamos la cabecera de tus stubs de Android en la línea 1 de panthor_kmod.c
          PANTHOR_C="src/panfrost/lib/kmod/panthor_kmod.c"
          if [ -f "$PANTHOR_C" ]; then
              sed -i '1i #include <sync/sync.h>' "$PANTHOR_C"
              echo "-> panthor_kmod.c parchado con éxito."
          fi
          
          # 6. 🟢 EL REMATE DE GALLIUM PANFROST: Inyectamos la cabecera de tus stubs de Android
          # en la línea 1 de pan_context.c para solucionar el error de 'sync_accumulate' de raíz.
          PAN_CONTEXT_C="src/gallium/drivers/panfrost/pan_context.c"
          if [ -f "$PAN_CONTEXT_C" ]; then
              echo "-> Inyectando cabecera sync.h de android_stub en pan_context.c..."
              sed -i '1i #include <sync/sync.h>' "$PAN_CONTEXT_C"
              echo "-> pan_context.c parchado con éxito con tus stubs legítimos."
          fi

      - name: ⚙️ 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 5. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 6. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 7. Forjar Paquete Esencial Puro para Bannerlator (Wrapper + Panfrost + ICDs)
        run: |
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          PANFROST_SO="build/src/panfrost/vulkan/libvulkan_panfrost.so"
          
          if [ -f "$WRAPPER_SO" ] && [ -f "$PANFROST_SO" ]; then
            echo "-> [Host] ¡Éxito! Forjando el árbol dual accesible..."
            rm -rf final_pkg
            mkdir -p final_pkg/usr/lib final_pkg/usr/share/vulkan/icd.d
            
            cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
            cp -fv "$PANFROST_SO" final_pkg/usr/lib/libvulkan_panfrost.so
            
            # TU REGLA DE COMODINES DE ADRENOTOOLS GANADORA INDESTRUCTIBLE
            cp -fv ./build/subprojects/libadrenotools/*.so ./build/subprojects/libadrenotools/src/hook/*.so final_pkg/usr/lib/ 2>/dev/null || true
            chmod -R 755 final_pkg/usr/lib/
            
            # Consolidando enlaces dinámicos con patchelf RPATH masivo
            patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
            patchelf --set-soname libvulkan_panfrost.so final_pkg/usr/lib/libvulkan_panfrost.so || true
            find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
            
            # Manifiestos JSON duales cruzados relativos planos
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_panfrost.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/panfrost_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_panfrost.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/panfrost_icd.arm.json
            
            # Forzamos guardado físico en el disco antes del cierre
            sync && sleep 3
            
            # TU MOTOR DE COMPRESIÓN GANADOR SÍNCRONO
            cd final_pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
            echo "-> ¡Paquete unificado con ICDs accesibles forjado con éxito!"
          else
            echo "-> [❌ ERROR GRAVE] Faltan binarios vitales de la compilación en build/."
            exit 1
          fi

      - name: 🚀 8. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
