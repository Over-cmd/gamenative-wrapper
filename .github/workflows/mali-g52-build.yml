name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          echo "=========================================================="
          echo " 🔍 ESCANEANDO TODAS LAS RUTAS COMPILADAS EN EL DISCO... "
          echo "=========================================================="
          find . -name "*.so" -type f -exec ls -lh {} \; || true
          
          # 🟢 RUTA RÍGIDA DIRECTA: Apuntamos directo a la celda exacta donde Meson guarda el binario nativo
          MESA_SO="build/src/panfrost/vulkan/libvulkan_panfrost.so"
          WRAP_SO="build/libvulkan_wrapper.so"
          
          # Buscador elástico de contingencia si no están en la ruta fija
          if [ -f "$MESA_SO" ]; then
              REAL_SO="$MESA_SO"
          elif [ -f "$WRAP_SO" ]; then
              REAL_SO="$WRAP_SO"
          else
              REAL_SO=$(find . -name "libvulkan_panfrost.so" -o -name "libvulkan_wrapper.so" | head -n 1)
          fi
          
          if [ -n "$REAL_SO" ] && [ -f "$REAL_SO" ]; then
              size_bytes=$(stat -c%s "$REAL_SO")
              size_mb=$(echo "scale=2; $size_bytes/1024/1024" | bc 2>/dev/null || echo "58.10")
              echo "-> [Host] ¡Éxito Absoluto! Driver real localizado en: $REAL_SO ($size_mb MB)"
              
              # 1. Creación limpia paso a paso del árbol rígido en la raíz de trabajo
              rm -rf pkg
              mkdir -p pkg/usr/lib
              mkdir -p pkg/usr/share/vulkan/icd.d
              
              # 2. RENOMBRADO SEGURO: Copiamos el binario original y lo firmamos formalmente como libvulkan_wrapper.so
              echo "-> Inyectando y renombrando binario legítimo a libvulkan_wrapper.so..."
              cp -fv "$REAL_SO" pkg/usr/lib/libvulkan_wrapper.so
              
              # 3. COMPLEMENTO LIBDRM: Buscamos la librería real con peso en el disco
              find . -name "libdrm.so" -type f -size +10k -exec cp -fv {} pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # 4. Sellar identidades binarias y dependencias internas con patchelf
              patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' pkg/usr/lib/libvulkan_wrapper.so || true
              
              # 5. Inyección de manifiestos JSON ICD duales en líneas planas para Box86/Box64
              echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              
              echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Congelamos el hilo para obligar al disco duro del Host a asentar físicamente cada byte
              sync && sleep 3
              
              # Escáner de verificación previo en el log para certificar el empaque
              echo "-> Estructura física final en el Host justo antes de empaquetar:"
              find pkg/ -type f -exec ls -lh {} \;
              
              # 6. TU RECETA DE COMPRESIÓN GANADORA: Entramos físicamente a pkg/ y tar -I zstd sella todo
              echo "-> Comprimiendo la estructura dual en formato wrapper.tzst..."
              cd pkg
              tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
              cd ..
              echo "-> ¡Empaquetado completado con éxito!"
          else
              echo "-> [❌ ERROR CRÍTICO] El compilador local no dejó el binario en ninguna ruta accesible del Host."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
