name: 🚀 Compilación Monolítica Fat Mali-G52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🛠️ Install Zstd Packager
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd patchelf

    - name: 🏗️ Lanzando Script de Compilación Monolítica Híbrida
      run: |
        chmod +x build.sh
        ./build.sh

    - name: 📦 Exportando Artefacto Ganador Descargable (.TZST)
      uses: actions/upload-artifact@v4
      with:
        name: Bannerlator-Mali-Wrapper
        path: ${{ github.workspace }}/wrapper.tzst
        if-no-files-found: error
