name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          # 🟢 COORDENADA RIGIDA INMUNE: Apuntamos directo al binario real de 19MB con adrenotools integrado
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
              size_bytes=$(stat -c%s "$WRAPPER_SO")
              size_mb=$(echo "scale=2; $size_bytes/1024/1024" | bc 2>/dev/null || echo "19.00")
              echo "-> [Host] ¡Éxito Total! Wrapper legítimo con adrenotools localizado. Peso real: $size_mb MB"
              
              # 1. Limpieza absoluta y creación del árbol de raíz plano en el Home del Host
              rm -rf final_pkg
              mkdir -p final_pkg/usr/lib
              mkdir -p final_pkg/usr/share/vulkan/icd.d
              
              # 2. Copiamos tu driver original de 19 MB directamente a usr/lib
              cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
              
              # 3. COMPLEMENTO LIBDRM: Buscamos si existe alguna librería real de soporte con peso en el disco
              find . -name "libdrm.so" -type f -size +10k -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # 4. Sellar identidades binarias y dependencias con patchelf
              patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' final_pkg/usr/lib/libvulkan_wrapper.so || true
              
              # 5. Inyección síncrona de manifiestos JSON ICD duales para Box86 y Box64
              echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              
              echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Congelamos el hilo para forzar el asentamiento real en el almacenamiento virtual
              sync && sleep 3
              
              # Escáner preventivo en el log para certificar el empaque perfecto
              echo "-> Estructura física final en el Host justo antes de empaquetar:"
              find final_pkg/ -type f -exec ls -lh {} \;
              
              # 🟢 TU RECETA DE COMPRESIÓN NATIVA INDESTRUCTIBLE CON CAMBIO DE DIRECTORIO FÍSICO
              echo "-> Comprimiendo la estructura dual en formato wrapper.tzst..."
              cd final_pkg
              tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
              cd ..
              echo "-> ¡Empaquetado unificado completado con éxito!"
          else
              echo "-> [❌ ERROR GRAVE] El compilador local falló en escribir el binario del wrapper original en build/src/vulkan/wrapper/"
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
