name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Paquete Esencial Puro para Bannerlator
        run: |
          # Coordenada del binario original del wrapper
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
              echo "-> [Host] ¡Éxito! Estructurando solo tus archivos esenciales legítimos..."
              
              # 1. Creación limpia paso a paso del árbol rígido
              rm -rf final_pkg
              mkdir -p final_pkg/usr/lib
              mkdir -p final_pkg/usr/share/vulkan/icd.d
              
              # 2. INYECTAR EL WRAPPER ORIGINAL DE 19 MB
              cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
              
              # 3. INYECTAR EXCLUSIVAMENTE TU KIT DE ADRENOTOOLS DE 5 ARCHIVOS
              cp -fv ./build/subprojects/libadrenotools/libadrenotools.so final_pkg/usr/lib/
              cp -fv ./build/subprojects/libadrenotools/src/hook/libmain_hook.so final_pkg/usr/lib/
              cp -fv ./build/subprojects/libadrenotools/src/hook/libgsl_alloc_hook.so final_pkg/usr/lib/
              cp -fv ./build/subprojects/libadrenotools/src/hook/libhook_impl.so final_pkg/usr/lib/
              cp -fv ./build/subprojects/libadrenotools/src/hook/libfile_redirect_hook.so final_pkg/usr/lib/
              
              # 4. RESCATE INDUSTRIAL DEL LIBDRM.SO REAL DE TERMUX (CON PESO REAL)
              echo "-> Extrayendo libdrm.so legítimo del sysroot de Termux..."
              # Primero buscamos en build de forma profunda un archivo real de más de 20KB
              find . -name "libdrm.so" -type f -size +20k -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # Si no lo encuentra, lo extraemos del volumen de Termux inyectado por Docker en build/rootfs_export si existe
              if [ ! -s "final_pkg/usr/lib/libdrm.so" ]; then
                  find build/ -name "libdrm.so" -type f -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              fi
              
              # Si por una locura del host sigue vacío, jalamos una copia de respaldo del sistema ubuntu
              if [ ! -s "final_pkg/usr/lib/libdrm.so" ]; then
                  echo "-> Usando libdrm de respaldo del Host..."
                  find /usr/lib/ -name "libdrm.so*" -type f -head -n 1 -exec cp -fv {} final_pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              fi
              
              # 5. ASENTAMIENTO DE PERMISOS RÍGIDOS 755
              chmod -R -v 755 final_pkg/usr/lib/
              
              # 6. CONSOLIDACIÓN DE ENLACES DINÁMICOS CON PATCHELF
              patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
              find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
              
              # 7. INYECCIÓN DE MANIFIESTOS ICD CON RUTA ABSOLUTA AL WRAPPER
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Sincronización estricta de escritura en disco
              sync && sleep 3
              
              # Escáner de confirmación pura en el log antes de empaquetar
              echo "=========================================================="
              echo " 🔍 REVISIÓN DE TU PAQUETE PURO EN EL HOST (USR/LIB):    "
              echo "=========================================================="
              find final_pkg/ -type f -exec ls -lh {} \;
              
              # 8. TU COMPRESIÓN GANADORA NATIVO SÍNCRONA
              echo "-> Forjando el archivo comprimido definitivo wrapper.tzst..."
              cd final_pkg
              tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
              cd ..
              echo "-> ¡Paquete esencial forjado con éxito!"
          else
              echo "-> [❌ ERROR GRAVE] No se localizó el libvulkan_wrapper.so en la carpeta del wrapper."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
