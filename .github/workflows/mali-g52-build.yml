name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code con Adrenotools Completo (Rama wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: 🛠️ 3. Aplicar Parche de Inodo Temporal en el Wrapper Legítimo (v103)
        run: |
          echo "=========================================================="
          echo " 🧬 PURIFICANDO RUTA DE LOGS TEMPORALES EN EL CÓDIGO      "
          echo "=========================================================="
          TARGET_C="src/vulkan/wrapper/wrapper_device.c"
          if [ -f "$TARGET_C" ]; then
              sed -i 's|/data/data/app.gamenative/files/imagefs/usr/tmp/|/tmp/|g' "$TARGET_C"
              echo "-> Parche de inodo temporal aplicado con éxito."
          else
              echo "-> [❌ ERROR CRÍTICO] No se localizó el archivo wrapper_device.c"
              exit 1
          fi

      - name: ⚙️ 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 5. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 6. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 7. Forjar Paquete Esencial Puro para Bannerlator (Wrapper + Panfrost + ICDs)
        run: |
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          PANFROST_SO="build/src/panfrost/vulkan/libvulkan_panfrost.so"
          
          if [ -f "$WRAPPER_SO" ] && [ -f "$PANFROST_SO" ]; then
            echo "-> [Host] ¡Éxito! Estructurando el árbol dual unificado completo..."
            rm -rf final_pkg
            mkdir -p final_pkg/usr/lib final_pkg/usr/share/vulkan/icd.d
            
            # 🟢 1. INYECTAR AMBOS COMPONENTES ORIGINALES DE GRÁFICOS
            cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
            cp -fv "$PANFROST_SO" final_pkg/usr/lib/libvulkan_panfrost.so
            
            # 🟢 2. TU REGLA DE COMODINES DE ADRENOTOOLS GANADORA INDESTRUCTIBLE
            cp -fv ./build/subprojects/libadrenotools/*.so ./build/subprojects/libadrenotools/src/hook/*.so final_pkg/usr/lib/ 2>/dev/null || true
            chmod -R 755 final_pkg/usr/lib/
            
            # Sellar identidades binarias y flags de carga interna (RPATH)
            patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
            patchelf --set-soname libvulkan_panfrost.so final_pkg/usr/lib/libvulkan_panfrost.so || true
            find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
            
            # 🟢 3. INYECTAR MANIFIESTOS JSON DUALES CRUZADOS (Ruta relativa plana)
            # Activadores para el Wrapper (32 y 64 bits)
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
            
            # Activadores para Panfrost (32 y 64 bits) para máxima compatibilidad
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_panfrost.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/panfrost_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_panfrost.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/panfrost_icd.arm.json
            
            # Forzamos guardado físico en el disco virtual antes de cerrar el tar
            sync && sleep 3
            
            # Escáner preventivo en la consola para certificar que nada falte
            echo "=========================================================="
            echo " 🔍 CONTROL INTEGRAL DEL PAQUETE COMPLETO:                "
            echo "=========================================================="
            find final_pkg/ -type f -exec ls -lh {} \;
            
            # 🟢 4. TU RECETA DE COMPRESIÓN GANADORA SÍNCRONA
            cd final_pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
            echo "-> ¡Estructura completa de controladores forjada con éxito!"
          else
            echo "-> [❌ ERROR GRAVE] Faltan archivos de la forja unificada en las subcarpetas build/."
            exit 1
          fi

      - name: 🚀 8. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
