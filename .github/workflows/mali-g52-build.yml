name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code (Rama Activa wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          REAL_SO=$(find ${{ env.BUILD_DIR }} -name "libvulkan_wrapper.so" | head -n 1)
          
          if [ -f "$REAL_SO" ]; then
              size_mb=$(os_size=$(stat -c%s "$REAL_SO"); echo "scale=2; $os_size/1024/1024" | bc 2>/dev/null || echo "9.3")
              echo "-> [Host] ¡Éxito Absoluto! Driver real localizado. Peso real: $size_mb MB"
              
              # 🟢 LIMPIEZA Y CREACIÓN PASO A PASO: Forzamos la creación del árbol rígido de forma explícita
              rm -rf pkg
              mkdir -p pkg/usr/lib
              mkdir -p pkg/usr/share
              mkdir -p pkg/usr/share/vulkan
              mkdir -p pkg/usr/share/vulkan/icd.d
              
              # Copiamos el binario a usr/lib
              cp -fv "$REAL_SO" pkg/usr/lib/libvulkan_wrapper.so
              find ${{ env.BUILD_DIR }} -name "libdrm.so" -exec cp -fv {} pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # Aplicamos patchelf
              patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' pkg/usr/lib/libvulkan_wrapper.so || true
              
              # 🟢 ESCRITURA INMUTABLE DIRECTA: Creamos el manifiesto JSON asegurando la ruta de salida
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              
              # Validamos en la consola del Host si el archivo realmente existe físicamente antes de empaquetar
              if [ -f "pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json" ]; then
                  echo "-> [Host] ¡Confirmado! wrapper_icd.aarch64.json creado físicamente en el disco."
              else
                  echo "-> [❌ ERROR CRÍTICO] No se pudo escribir el archivo JSON de manifiesto."
                  exit 1
              fi
              
              # 🟢 EMPAQUE NATIVO COMPLETO: Sincronizamos tar para que capture todo el árbol de usr/ de forma recursiva
              echo "-> Forjando el archivo comprimido definitivo wrapper.tzst..."
              cd pkg
              tar -cvf - usr | zstd -19 -T0 > ../wrapper.tzst
              cd ..
              
              echo "=========================================================="
              echo " 🟢 MAQUETACIÓN COMPLETADA - ARCHIVO WRAPPER.TZST LISTO OK "
              echo "=========================================================="
          else
              echo "-> [❌ ERROR GRAVE] El compilador local falló en escribir el binario de 9.3 MB."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
