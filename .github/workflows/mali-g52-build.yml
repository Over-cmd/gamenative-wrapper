name: GameNative Vulkan Wrapper Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-gamenative-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Core Source
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Android libdrm Source
        uses: actions/checkout@v4
        with:
          repository: waydroid/android_external_libdrm
          ref: lineage-18.1
          path: main-repo/subprojects/libdrm

      - name: Checkout libadrenotools Source
        uses: actions/checkout@v4
        with:
          repository: Pipetto-crypto/libadrenotools
          ref: master
          path: main-repo/subprojects/libadrenotools

      # 🟢 PASO MAESTRO REPARADO: Forzamos la descarga real de linkernsbypass rellenando los submodulos
      - name: Fetch libadrenotools Git Submodules Recursively
        run: |
          cd main-repo/subprojects/libadrenotools
          echo "-> Inicializando submodulos criticos de libadrenotools de forma recursiva..."
          git submodule update --init --recursive

      - name: Inject Hardware Patches for Mali-G52
        run: |
          echo "-> Aplicando parches criticos en los archivos de utilidades..."
          sed -i 's/fd = syscall(SYS_memfd_create.*/fd = memfd_create(debug_name, MFD_CLOEXEC \| MFD_ALLOW_SEALING);/g' main-repo/src/util/anon_file.c 2>/dev/null || true
          find main-repo/ -name "pan_device.c" -exec sed -i 's/pan_query_core_count(&dev->kmod.dev->props, &dev->core_id_range);/dev->core_id_range = pan_query_core_count(\&dev->kmod.dev->props);/g' {} + 2>/dev/null || true
          find main-repo/ -name "pan_device.c" -exec sed -i 's/\\&/\&/g' {} + 2>/dev/null || true
          
          echo "-> Destruyendo los validadores rigidos de Android y Log en el subproyecto de Pipetto..."
          if [ -f "main-repo/subprojects/libadrenotools/meson.build" ]; then
            sed -i "s/.*find_library.*android.*/  dep_android = dependency('', required : false)/g" main-repo/subprojects/libadrenotools/meson.build
            sed -i "s/.*find_library.*log.*/  dep_log = dependency('', required : false)/g" main-repo/subprojects/libadrenotools/meson.build
            echo "=== Verificando parches aplicados ==="
            cat main-repo/subprojects/libadrenotools/meson.build | head -n 25
          fi
          
          echo "-> Purgando validaciones rigidas de librerias de sistema en meson.build central..."
          sed -i "s/cc.find_library('rt'/dependency('', required : false) #/g" main-repo/meson.build 2>/dev/null || true
          sed -i "s/cc.find_library('atomic'/dependency('', required : false) #/g" main-repo/meson.build 2>/dev/null || true
          sed -i "s/cc.find_library('dl'/dependency('', required : false) #/g" main-repo/meson.build 2>/dev/null || true
          
          rm -f main-repo/subprojects/*.wrap main-repo/*.wrap 2>/dev/null || true

      - name: Install Base Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libelf-dev bison flex pkg-config gettext patchelf unzip llvm clang
          python -m pip install --upgrade pip && pip install mako PyYAML 'meson>=1.4.0' ninja packaging

      - name: Unzip Local Android Shims
        run: |
          cd main-repo
          unzip -o shims.zip -d ./ && mkdir -p "$GITHUB_WORKSPACE/shims_target" && cp -rf ./shims/* "$GITHUB_WORKSPACE/shims_target/"

      - name: Auto-Detect True Android NDK Path
        run: |
          for path in /usr/local/lib/android/sdk/ndk/* /home/runner/Android/Sdk/ndk/*; do
            if [ -d "$path/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then echo "REAL_NDK_HOME=$path" >> $GITHUB_ENV; break; fi
          done

      - name: Configure GameNative Cross-Compilation (Meson)
        run: |
          cd main-repo
          export ANDROID_NDK_HOME="${{ env.REAL_NDK_HOME }}"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE/main-repo"
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/shims_target"
          export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/shims_target"
          
          if [ -f "android-64.toml" ]; then envsubst < android-64.toml > cross.txt; else envsubst < android.toml > cross.txt; fi
          
          sed -i "s|pkg_config_libdir = .*|pkg_config_libdir = '$PKG_CONFIG_PATH'|g" cross.txt
          sed -i "s|pkg_config_path = .*|pkg_config_path = '$PKG_CONFIG_PATH'|g" cross.txt
          sed -i "s|libdrm_path = .*|libdrm_path = '$GITHUB_WORKSPACE/main-repo/subprojects/libdrm'|g" cross.txt
          
          sed -i "s|c_link_args = \[|c_link_args = ['-landroid', '-llog', '-lsync', '-lhardware', '-L${{ env.REAL_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/30', '-L$PKG_CONFIG_PATH', |g" cross.txt
          sed -i "s|cpp_link_args = \[|cpp_link_args = ['-landroid', '-llog', '-lsync', '-lhardware', '-L${{ env.REAL_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/30', '-L$PKG_CONFIG_PATH', |g" cross.txt
          
          echo "-> Lanzando inicialización de Meson para tu Mali-G52..."
          meson setup build --reconfigure --cross-file cross.txt --wrap-mode=nodownload -Dbuildtype=release -Dplatforms=android -Dandroid-stub=true -Dglx=disabled -Dgbm=disabled -Degl=disabled -Dopengl=false -Dgles1=disabled -Dgles2=disabled -Dllvm=disabled -Dvalgrind=disabled -Dzstd=disabled -Dvulkan-drivers=panfrost,wrapper -Dgallium-drivers=[]

      - name: Compile GameNative Engine
        run: |
          cd main-repo
          meson compile -C build

      - name: Structure and Pack wrapper.tzst for Bannerlator
        run: |
          cd main-repo
          rm -rf pkg && mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d pkg/usr/share/vulkan/settings.d
          cp -v build/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so 2>/dev/null || true
          cp -v build/src/panfrost/vulkan/libvulkan_panfrost.so pkg/usr/lib/libvulkan_panfrost.so 2>/dev/null || true
          
          patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so 2>/dev/null || true
          llvm-strip --strip-unneeded pkg/usr/lib/*.so 2>/dev/null || true
          
          echo '{"ICD": {"api_version": "1.4.352", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          echo '{"ICD": {"api_version": "1.4.352", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          echo '{"env":{"PAN_I_WANT_A_BROKEN_VULKAN_DRIVER":"1","MESA_VK_IGNORE_CONFORMANCE_WARNING":"1","PANVK_DEBUG":"sync,nir","MESA_VK_FORCE_BLIT":"1","MESA_LOADER_DRIVER_OVERRIDE":"panfrost","GALLIUM_DRIVER":"panfrost","vblank_mode":"0","MESA_GLSL_CACHE_DISABLE":"1","MESA_SHADER_CACHE_DISABLE":"true","NIR_DEBUG":"tgsi","MESA_VK_WSI_PRESENT_MODE":"immediate","MESA_VK_WSI_DEBUG":"always_async"}}' > pkg/usr/share/vulkan/settings.d/wrapper_settings.json
          
          echo "msf:315508" > pkg/version.txt && chmod -R 755 pkg/
          cd pkg && tar -I 'zstd -19 -T0' -cf ../../wrapper.tzst usr/ version.txt

      - name: Upload Final wrapper.tzst
        uses: actions/upload-artifact@v4
        with:
          name: GameNative-Mali-G52-Wrapper
          path: wrapper.tzst
