name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code (Rama Activa wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          REAL_SO=$(find ${{ env.BUILD_DIR }} -name "libvulkan_wrapper.so" | head -n 1)
          
          if [ -f "$REAL_SO" ]; then
              size_mb=$(os_size=$(stat -c%s "$REAL_SO"); echo "scale=2; $os_size/1024/1024" | bc 2>/dev/null || echo "18.60")
              echo "-> [Host] ¡Éxito Absoluto! Driver real localizado. Peso real: $size_mb MB"
              
              # 1. Creación limpia del árbol de directorios de raíz rígido
              echo "-> Creando árbol de directorios de Linux para Bannerlator..."
              rm -rf pkg
              mkdir -p pkg/usr/lib
              mkdir -p pkg/usr/share/vulkan/icd.d
              
              # 2. Inyectar tu driver real de 18.60 MB en su celda destino
              cp -fv "$REAL_SO" pkg/usr/lib/libvulkan_wrapper.so
              find ${{ env.BUILD_DIR }} -name "libdrm.so" -exec cp -fv {} pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # Modificaciones complementarias de patchelf de seguridad
              patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' pkg/usr/lib/libvulkan_wrapper.so || true
              
              # 3. Inyección del manifiesto JSON ICD oficial de 64 bits (AArch64) para Box64
              echo "-> Inyectando manifiesto JSON ICD oficial de 64 bits (AArch64)..."
              cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "/usr/lib/libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
              
              # 4. Inyección del manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86
              echo "-> Inyectando manifiesto JSON ICD oficial de 32 bits (ARM) para salvar Box86..."
              cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "/usr/lib/libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
              
              # Aseguramos el asentamiento físico en las pistas del disco virtual
              sync && sleep 2
              
              # 🟢 TU NUEVO EMPAQUETADO GANADOR: Entramos físicamente a pkg/ y forzamos a tar 
              # a usar el filtro interno de zstd de forma síncrona, capturando el árbol entero.
              echo "-> Comprimiendo la estructura dual en formato wrapper.tzst..."
              cd pkg
              tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
              cd ..
              echo "-> ¡Empaquetado completado con éxito!"
          else
              echo "-> [❌ ERROR GRAVE] El compilador local falló en escribir el binario de 18.60 MB."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
