name: Bannerlator Mali Wrapper CI

on:
  push:
    branches:
      - wrapper-25
  workflow_dispatch:

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Code (Rama Activa wrapper-25)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: ⚙️ 2. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: ⚙️ 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Maquetación Plana e ICD para Bannerlator
        run: |
          REAL_SO=$(find ${{ env.BUILD_DIR }} -name "libvulkan_panfrost.so" -o -name "libvulkan_wrapper.so" | head -n 1)
          
          if [ -f "$REAL_SO" ]; then
              size_mb=$(os_size=$(stat -c%s "$REAL_SO"); echo "scale=2; $os_size/1024/1024" | bc 2>/dev/null || echo "58.10")
              echo "-> [Host] ¡Éxito! Driver real localizado. Peso: $size_mb MB"
              
              # 1. Creación limpia paso a paso del árbol rígido en la raíz de trabajo
              rm -rf pkg
              mkdir -p pkg/usr/lib
              mkdir -p pkg/usr/share/vulkan/icd.d
              
              # 🟢 CORRECCIÓN DE REGLA: Forzamos el renombrado plano directo hacia libvulkan_wrapper.so
              echo "-> Inyectando y renombrando binario legítimo a libvulkan_wrapper.so..."
              cp -fv "$REAL_SO" pkg/usr/lib/libvulkan_wrapper.so
              
              # Copiamos opcionalmente una copia secundaria con el nombre original por compatibilidad interna de Mesa
              cp -fv "$REAL_SO" pkg/usr/lib/libvulkan_panfrost.so
              
              # Jalar de forma complementaria libdrm.so de soporte si existe en el build
              find ${{ env.BUILD_DIR }} -name "libdrm.so" -exec cp -fv {} pkg/usr/lib/libdrm.so \; 2>/dev/null || true
              
              # Sellar identidades binarias y dependencias internas con patchelf
              patchelf --set-soname libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || true
              patchelf --set-rpath '$ORIGIN' pkg/usr/lib/libvulkan_wrapper.so || true
              if [ -f "pkg/usr/lib/libvulkan_panfrost.so" ]; then
                  patchelf --set-soname libvulkan_panfrost.so pkg/usr/lib/libvulkan_panfrost.so || true
                  patchelf --set-rpath '$ORIGIN' pkg/usr/lib/libvulkan_panfrost.so || true
              fi
              
              # 2. Inyección del manifiesto JSON ICD oficial de 64 bits (AArch64) en una línea plana
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
              
              # 3. Inyección del manifiesto JSON ICD oficial de 32 bits (ARM) para Box86
              echo '{"ICD": {"api_version": "1.3.289", "library_path": "/usr/lib/libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
              
              # Congelamos el hilo para obligar al disco duro del Host a escribir físicamente cada byte
              sync && sleep 3
              
              # 4. ESCÁNER DE CONFIRMACIÓN: Listamos el paquete en la consola para certificar la existencia real
              echo "-> Verificando estructura física unificada antes de la compresión:"
              find pkg/ -type f -exec ls -lh {} \;
              
              # 5. EMPAQUETADO COMPACTO CON FILTRO NATIVO DESDE EL ENTORNO ABSOLUTO
              echo "-> Forjando el archivo comprimido definitivo wrapper.tzst..."
              tar -C pkg -I 'zstd -19 -T0' -cf wrapper.tzst usr
              
              echo "=========================================================="
              echo " 🟢 MAQUETACIÓN COMPLETADA - ARCHIVO WRAPPER.TZST LISTO OK  "
              echo "=========================================================="
          else
              echo "-> [❌ ERROR GRAVE] El compilador local falló en escribir el binario base de Mesa."
              exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
