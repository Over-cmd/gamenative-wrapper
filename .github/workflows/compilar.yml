name: Mesa Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: wrapper-compiler

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Zstd Packager
        run: sudo apt-get update && sudo apt-get install -y zstd python3

      # INYECCIÓN MASIVA COMPACTA BLINDADA (Escapes octales para evitar conflictos con el parser de GitHub)
      - name: Inject Virtual Graphics and System Manifests for Pkg-Config
        run: |
          mkdir -p bin_hijack/pkgconfig
          cat << 'EOF' > gen_pc.py
          pkgs = ['libdrm','xcb','x11','libelf','libudev','xcb-randr','xcb-shm','xext','xrandr','xrender','xorgproto','libunwind','spirv-tools','valgrind','x11-xcb','xcb-keysyms','xcb-dri3','xcb-present','xcb-sync','xcb-xfixes','xdmcp','xau','xshmfence','xcb-dri2']
          for p in pkgs:
              with open(f'bin_hijack/pkgconfig/{p}.pc', 'w') as f:
                  f.write("prefix=/usr\nlibdir=$" + "{" + "prefix}/lib\nincludedir=$" + "{" + "prefix}/include\nName: " + p + "\nDescription: Virtual Bypass\nVersion: 9.9.9\nLibs: -lm\nCflags: -I$" + "{" + "includedir}\n")
          EOF
          python3 gen_pc.py && rm gen_pc.py

      # PARCHE MAESTRO INTEGRADO REPARADO (Soporta comillas dobles y simples para libadrenotools)
      - name: Inject Anti-Crash Hook and Bypass Meson Requirements
        run: |
          python3 -c "
          import os
          # 1. Parche Pipetto e Interceptor de 32 bits en wrapper_instance.c
          p = 'src/vulkan/wrapper/wrapper_instance.c'
          if os.path.exists(p):
              c = open(p,'r',errors='ignore').read().replace('vk_icdGetInstanceProcAddr(VkInstance','original_vk_icdGetInstanceProcAddr(VkInstance').replace('vk_icdGetInstanceProcAddr(void*','original_vk_icdGetInstanceProcAddr(void*')
              open(p,'w').write(c + '\n#include <string.h>\nextern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o);\nVKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL original_vk_icdGetInstanceProcAddr(VkInstance i, const char *n);\nVKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL vk_icdGetInstanceProcAddr(VkInstance i, const char *n) {\n mallopt(-1002, 0); setenv(\"MESA_VK_WSI_PRESENT_MODE\", \"mailbox\", 1); setenv(\"vblank_mode\", \"0\", 1);\n if (sizeof(void*) == 4) {\n setenv(\"MESA_VK_WSI_QUEUE_SIZE\", \"1\", 1); setenv(\"BOX86_EMULATED_LIBS\", \"libvulkan_wrapper.so\", 1); setenv(\"BOX86_MMAP32\", \"1\", 1);\n if (n && (strcmp(n, \"vkGetPhysicalDeviceProperties2KHR\") == 0 || strcmp(n, \"vkGetPhysicalDeviceFeatures2KHR\") == 0 || strcmp(n, \"vkRegisterDeviceCustomCallbacksEXT\") == 0)) return (PFN_vkVoidFunction)NULL;\n }\n return original_vk_icdGetInstanceProcAddr(i, n);\n}\n')
          # 2. Exponer símbolo ICD en el mapa de exportación
          for r, d, files in os.walk('src/vulkan/wrapper'):
              for file in files:
                  if file.endswith(('.def', '.map')) or file == 'meson.build':
                      tp = os.path.join(r, file); content = open(tp,'r',errors='ignore').read()
                      if 'vk_icdGetInstanceProcAddr' in content: open(tp,'w').write(content.replace('vk_icdGetInstanceProcAddr', 'vk_icdGetInstanceProcAddr\n    vk_icdNegotiateLoaderICDInterfaceVersion'))
          # 3. Eliminar comprobación estricta de libatomic, libdl, librt, libm, libelf y landroid en bloque (con soporte de comillas dobles)
          for f in ['meson.build', 'subprojects/libadrenotools/meson.build']:
              if os.path.exists(f):
                  txt = open(f,'r',errors='ignore').read().replace(\"compiler.find_library('atomic'\", \"null_dep #\").replace(\"cc.find_library('atomic'\", \"null_dep #\").replace(\"compiler.find_library('dl'\", \"null_dep #\").replace(\"cc.find_library('dl'\", \"null_dep #\").replace(\"compiler.find_library('rt'\", \"null_dep #\").replace(\"cc.find_library('rt'\", \"null_dep #\").replace(\"compiler.find_library('m'\", \"null_dep #\").replace(\"cc.find_library('m'\", \"null_dep #\").replace(\"compiler.find_library('elf'\", \"null_dep #\").replace(\"cc.find_library('elf'\", \"null_dep #\").replace(\"cxx.find_library('android')\", \"null_dep\").replace(\"compiler.find_library('android')\", \"null_dep\").replace('cxx.find_library(\"android\")', 'null_dep').replace('compiler.find_library(\"android\")', 'null_dep')
                  if 'dep_rt' in txt: txt = txt.replace('dep_rt = null_dep', 'dep_rt = null_dep\ndep_clock = null_dep')
                  open(f,'w').write(txt)
          "

      - name: Build Local Corrected Docker Image
        run: docker build -t ${{ env.IMAGE_TAG }}:latest .

      - name: Pre-configure Meson Blueprint Folder
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/pkgconfig:/data/data/com.termux/files/usr/lib/pkgconfig" \
            -e PKG_CONFIG_PATH="/data/data/com.termux/files/usr/lib/pkgconfig" \
            --entrypoint /bin/bash \
            ${{ env.IMAGE_TAG }}:latest -c "meson setup ${{ env.BUILD_DIR }} --cross-file /root/build-config/cross_file.txt -Dcpp_rtti=false -Dgbm=disabled -Dopengl=false -Dllvm=disabled -Dshared-llvm=disabled -Dplatforms=x11 -Dgallium-drivers= -Dxmlconfig=disabled -Dvulkan-drivers=wrapper"

      - name: Wrapper Compiler (Atomic Processing Docker MALI)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/pkgconfig:/data/data/com.termux/files/usr/lib/pkgconfig" \
            -e PKG_CONFIG_PATH="/data/data/com.termux/files/usr/lib/pkgconfig" \
            ${{ env.IMAGE_TAG }}:latest ${{ env.BUILD_DIR }}

      - name: Structure and Pack wrapper.tzst
        run: |
          mkdir -p pkg/usr/lib pkg/usr/share/vulkan/icd.d
          cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "ICD": { "api_version": "1.3.289", "library_path": "libvulkan_wrapper.so" }, "file_format_version": "1.0.0" }
          EOF
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
          { "ICD": { "api_version": "1.3.289", "library_path": "libvulkan_wrapper.so" }, "file_format_version": "1.0.0" }
          EOF
          cd pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper-Universal
          path: wrapper.tzst
          if-no-files-found: error
